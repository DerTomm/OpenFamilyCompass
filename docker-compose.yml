services:
  postgres:
    image: postgres:16-alpine
    container_name: ofc-postgres
    environment:
      POSTGRES_DB: openfamilycompass_db
      POSTGRES_USER: openfamilycompass_user
      POSTGRES_PASSWORD: openfamilycompass_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openfamilycompass-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  openfamilycompass-network:
    driver: bridge
