services:
  postgres:
    image: postgres:16-alpine
    container_name: ofc-postgres
    environment:
      POSTGRES_DB: openfamilycompass_db
      POSTGRES_USER: openfamilycompass_user
      POSTGRES_PASSWORD: openfamilycompass_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openfamilycompass-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfamilycompass_user -d openfamilycompass_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ofc-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfamilycompass_db
      SPRING_DATASOURCE_USERNAME: openfamilycompass_user
      SPRING_DATASOURCE_PASSWORD: openfamilycompass_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
    ports:
      - "8080:8080"
    networks:
      - openfamilycompass-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  openfamilycompass-network:
    driver: bridge
