# OpenFamilyCompass - Docker Compose Configuration
# Deployment für Backend + Frontend + Postgres

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ofc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfamilycompass_db}
      POSTGRES_USER: ${POSTGRES_USER:-openfamilycompass_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfamilycompass_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ofc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfamilycompass_user} -d ${POSTGRES_DB:-openfamilycompass_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ofc-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openfamilycompass_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-openfamilycompass_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-openfamilycompass_password}
      
      # JPA & Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
      
      # Security
      APP_ADMIN_DEFAULT_USERNAME: ${APP_ADMIN_DEFAULT_USERNAME:-admin}
      APP_ADMIN_DEFAULT_PASSWORD: ${APP_ADMIN_DEFAULT_PASSWORD:-changeme}
      
      # Server
      SERVER_PORT: 8080
      
      # CORS - Allow frontend
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:19006}
      
      # JWT Keys - wird durch Volume gemountet
      JWT_KEYSTORE_PATH: /app/config/jwt-keys.pfx
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:-}
      
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # JWT Keys
      - ./backend/jwt-keys.pfx:/app/config/jwt-keys.pfx:ro
      # Media/Upload Directory (persistent)
      - media_data:/app/media
    networks:
      - ofc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Frontend (React Native Web via Expo)
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ofc-frontend
    depends_on:
      - backend
    environment:
      # Backend API URL (wird zur Build-Zeit in den Web-Build eingebaut)
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - ofc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  ofc-network:
    driver: bridge
