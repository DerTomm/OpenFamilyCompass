services:
  postgres:
    image: postgres:16-alpine
    container_name: kids-chores-postgres
    environment:
      POSTGRES_DB: kidschores
      POSTGRES_USER: kidschores_user
      POSTGRES_PASSWORD: kidschores_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kids-chores-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  kids-chores-network:
    driver: bridge
