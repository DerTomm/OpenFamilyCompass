spring:
  application:
    name: OpenFamilyCompass

  # Build info (automatically populated by maven)
  info:
    app:
      name: OpenFamilyCompass
      description: Open source family management application

  datasource:
    # ⚠️ SECURITY WARNING: Change these credentials in production!
    # Use environment variables or external configuration for production deployments
    # Example: SPRING_DATASOURCE_PASSWORD=your_secure_password
    url: jdbc:postgresql://localhost:5432/openfamilycompass_db
    username: openfamilycompass_user
    password: openfamilycompass_password # ⚠️ CHANGE IN PRODUCTION!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    user:
      # ⚠️ SECURITY WARNING: These are default credentials for development only!
      # The application creates a proper admin user (see app.admin below)
      name: admin
      password: admin # ⚠️ FOR DEVELOPMENT ONLY!

server:
  port: 8080
  error:
    include-message: always

# Spring Boot Actuator - Health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized # Show details only for authenticated users
      show-components: when-authorized
  health:
    defaults:
      enabled: true

logging:
  level:
    org.openfamilycompass: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

cors:
  # Comma-separated list of origins (or wildcard patterns such as
  # https://*.example.com) that are allowed to make authenticated
  # cross-origin requests. Empty by default, which disables CORS for browser
  # clients. Native mobile clients (React Native / Expo) do not send an
  # Origin header and are unaffected.
  # Configure via env var: CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
  allowed-origins: ""

app:
  avatars:
    upload-dir: uploads/avatars
  admin:
    # ⚠️ SECURITY WARNING: These are default credentials for first-time setup only!
    # IMMEDIATELY change the admin password after first login in production!
    # Or set via environment: APP_ADMIN_DEFAULT_PASSWORD=your_secure_password
    default-username: admin
    default-password: "admin" # ⚠️ CHANGE AFTER FIRST LOGIN!
  security:
    # Secure by default: when true (or when the 'prod' Spring profile is
    # active), the application refuses to start if insecure default credentials
    # are detected for APP_ADMIN_DEFAULT_PASSWORD or
    # APP_SECURITY_JWT_KEYSTORE_PASSWORD.
    # For local development, override via env var or .env file:
    #   APP_SECURITY_FAIL_ON_DEFAULT_CREDENTIALS=false
    # Never disable this in production deployments.
    fail-on-default-credentials: true

# Firebase Cloud Messaging Configuration
# The service account JSON must be provided at runtime - it is NOT bundled in the JAR.
# Override the path via env var FCM_SERVICE_ACCOUNT_PATH when deploying with Docker.
fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# Swagger UI Configuration (JWT)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
