<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-users"></i> <span th:text="#{admin.user.management}">Benutzerverwaltung</span></h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/admin/users/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> <span th:text="#{admin.user.new}">Neuer Benutzer</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" th:text="#{admin.users.all}">Alle Benutzer</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th th:text="#{admin.users.username}">Benutzername</th>
                                        <th th:text="#{admin.users.role}">Rolle</th>
                                        <th th:text="#{admin.users.status}">Status</th>
                                        <th th:text="#{admin.users.created}">Erstellt am</th>
                                        <th th:text="#{tasks.actions}">Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.username}">Username</td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'PARENT'} ? 'bg-success' : 'bg-info')"
                                                th:text="#{${user.role.getDisplayKey()}}">Role</span>
                                        </td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'">
                                                <span th:if="${user.active}" th:text="#{status.active}">Aktiv</span>
                                                <span th:if="${!user.active}"
                                                    th:text="#{status.inactive}">Inaktiv</span>
                                            </span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">Datum
                                        </td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary" disabled>
                                                <i class="fas fa-edit"></i> <span
                                                    th:text="#{button.edit}">Bearbeiten</span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
