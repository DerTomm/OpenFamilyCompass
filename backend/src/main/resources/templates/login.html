<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFamilyCompass - Login</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <img th:src="@{/images/logo.png}" alt="OpenFamilyCompass"
                                style="width: 80px; height: 80px; margin-bottom: 1rem;">
                            <h1 class="h3 mb-3 fw-normal" th:text="#{app.name}">OpenFamilyCompass</h1>
                            <p class="text-muted" th:text="#{login.subtitle}">login.subtitle</p>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="#{login.error}">
                            ❌ login.error
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success" role="alert"
                            th:text="#{login.logout.success}">
                            ✅ login.logout.success
                        </div>

                        <form th:action="@{/perform_login}" method="post" id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{login.username}"></label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username"
                                    required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label" th:text="#{login.password}"></label>
                                <input type="password" class="form-control form-control-lg" id="password"
                                    name="password" required>
                                <div class="form-text" th:text="#{login.password.hint}"></div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me">
                                    Angemeldet bleiben
                                </label>
                                <div class="form-text">Automatisch einloggen beim nächsten Besuch</div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                🚀 <span th:text="#{login.button}"></span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
