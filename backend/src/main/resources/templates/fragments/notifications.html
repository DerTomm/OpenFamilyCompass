<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="notificationDropdown(notifications)" class="dropdown">
    <a class="nav-link dropdown-toggle text-white position-relative" href="#" id="notificationDropdown" role="button"
        data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fas fa-bell fa-lg"></i>
        <span th:if="${notifications != null and !notifications.empty}"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            th:text="${notifications.size()}">
            0
        </span>
    </a>
    <ul class="dropdown-menu dropdown-menu-end notification-dropdown" aria-labelledby="notificationDropdown"
        style="min-width: 350px; max-width: 400px;">
        <li th:if="${notifications == null or notifications.empty}">
            <h6 class="dropdown-header text-center">
                <i class="fas fa-inbox"></i> Keine neuen Benachrichtigungen
            </h6>
        </li>
        <li th:if="${notifications != null and !notifications.empty}">
            <h6 class="dropdown-header">
                <i class="fas fa-bell"></i> Benachrichtigungen
                <a href="/notifications" class="float-end text-decoration-none">
                    <small>Alle anzeigen</small>
                </a>
            </h6>
        </li>
        <li th:if="${notifications != null and !notifications.empty}">
            <hr class="dropdown-divider">
        </li>
        <li th:each="notification : ${notifications}" class="notification-item">
            <a class="dropdown-item d-flex align-items-start"
                th:href="${notification.referenceId != null ? '#' + notification.referenceId : '/notifications'}"
                th:data-notification-id="${notification.id}" onclick="markAsRead(this)">
                <div class="me-3">
                    <i th:classappend="'fas fa-lg ' + ${notification.type.iconClass}"
                        th:class="'text-' + ${notification.type.colorClass}"></i>
                </div>
                <div class="flex-grow-1">
                    <div class="fw-bold" th:text="${notification.title}">Titel</div>
                    <small class="text-muted" th:text="${notification.message}">Nachricht</small>
                    <div class="text-muted mt-1">
                        <small th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy HH:mm')}">Zeit</small>
                    </div>
                </div>
                <div th:if="${!notification.read}" class="ms-2">
                    <span class="badge bg-primary">Neu</span>
                </div>
            </a>
        </li>
        <li th:if="${notifications != null and !notifications.empty}">
            <hr class="dropdown-divider">
        </li>
        <li th:if="${notifications != null and !notifications.empty}">
            <div class="dropdown-item text-center">
                <button class="btn btn-sm btn-outline-primary" onclick="markAllAsRead()">
                    <i class="fas fa-check-double"></i> Alle als gelesen markieren
                </button>
            </div>
        </li>
    </ul>
</div>

<script th:fragment="notificationScripts">
    function markAsRead(element) {
        const notificationId = element.getAttribute('data-notification-id');
        if (notificationId) {
            fetch(`/notifications/${notificationId}/read`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
                }
            }).then(() => {
                // Entferne das "Neu" Badge
                const badge = element.querySelector('.badge');
                if (badge) badge.remove();

                // Aktualisiere die Zählung im Icon
                updateNotificationCount();
            }).catch(error => console.error('Error marking notification as read:', error));
        }
    }

    function markAllAsRead() {
        fetch('/notifications/mark-all-read', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]').getAttribute('content')
            }
        }).then(() => {
            // Entferne alle "Neu" Badges
            document.querySelectorAll('.notification-item .badge').forEach(badge => badge.remove());
            // Aktualisiere die Zählung im Icon
            updateNotificationCount();
        }).catch(error => console.error('Error marking all notifications as read:', error));
    }

    function updateNotificationCount() {
        fetch('/notifications/unread/count')
            .then(response => response.json())
            .then(count => {
                const notificationIcon = document.querySelector('#notificationDropdown');
                const badge = notificationIcon ? notificationIcon.querySelector('.badge') : null;
                if (count > 0) {
                    if (badge) {
                        badge.textContent = count;
                    } else {
                        // Badge hinzufügen falls nicht vorhanden
                        const newBadge = document.createElement('span');
                        newBadge.className = 'position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger';
                        newBadge.textContent = count;
                        notificationIcon.appendChild(newBadge);
                    }
                } else {
                    if (badge) badge.remove();
                }
            })
            .catch(error => console.error('Error updating notification count:', error));
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', function () {
        updateNotificationCount();
    });
</script>

</html>
