# ⚠️ SECURITY WARNING FOR PRODUCTION DEPLOYMENTS:
# DO NOT use these default passwords in production!
# Override them using a .env file or environment variables:
#   POSTGRES_PASSWORD=your_secure_db_password
#   SPRING_DATASOURCE_PASSWORD=your_secure_db_password
#   SPRING_SECURITY_OAUTH2_CLIENT_SECRET=your_secure_oauth_secret
#   APP_ADMIN_DEFAULT_PASSWORD=your_secure_admin_password

services:
  postgres:
    image: postgres:16-alpine
    container_name: ofc-postgres
    environment:
      POSTGRES_DB: openfamilycompass_db
      POSTGRES_USER: openfamilycompass_user
      POSTGRES_PASSWORD: openfamilycompass_password # ⚠️ CHANGE IN PRODUCTION!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - openfamilycompass-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U openfamilycompass_user -d openfamilycompass_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Use pre-built image from GitHub Container Registry for production/releases
    # For development, uncomment the 'build' section below
    image: ghcr.io/dertomm/openfamilycompass:latest
    # Alternatively, build locally during development:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: ofc-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openfamilycompass_db
      SPRING_DATASOURCE_USERNAME: openfamilycompass_user
      SPRING_DATASOURCE_PASSWORD: openfamilycompass_password # ⚠️ CHANGE IN PRODUCTION!
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: true
      # SPRING_SECURITY_OAUTH2_CLIENT_SECRET: change-me-in-production  # Uncomment and set in production!
      # APP_ADMIN_DEFAULT_PASSWORD: your_secure_password  # Uncomment and set in production!

      # JWT Keystore - stored in a named volume so the auto-generated key pair survives restarts.
      # No manual key creation required; the app generates the keystore on first startup.
      APP_SECURITY_JWT_KEYSTORE_PATH: /app/config/jwt-keys.pfx
      APP_SECURITY_JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:-changeit}

      # Firebase Cloud Messaging - optional. Mount the service account JSON to enable push
      # notifications. If the file is absent, push notifications are silently disabled.
      FCM_SERVICE_ACCOUNT_PATH: /app/config/firebase-service-account.json
    ports:
      - "8080:8080"
    volumes:
      # Persists the auto-generated JWT keystore across container restarts.
      # The app creates jwt-keys.pfx automatically on first startup - no manual setup needed.
      - app_config:/app/config
      # Optional: mount your Firebase service account JSON to enable push notifications.
      # If this file does not exist on the host the bind-mount line should be removed or
      # commented out, otherwise Docker Compose will create an empty directory at that path.
      # - ./firebase-service-account.json:/app/config/firebase-service-account.json:ro
    networks:
      - openfamilycompass-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  # Persists auto-generated credentials (e.g. jwt-keys.pfx) across container restarts.
  app_config:
    driver: local

networks:
  openfamilycompass-network:
    driver: bridge
