plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services' version '4.4.4'
}

android {
    namespace 'org.openfamilycompass.android'
    compileSdk 34

    defaultConfig {
        applicationId "org.openfamilycompass.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Keystore configuration should be provided via gradle.properties or environment variables
            // Create a file 'keystore.properties' in the android-app directory with:
            // RELEASE_STORE_FILE=path/to/your.keystore
            // RELEASE_STORE_PASSWORD=your_store_password
            // RELEASE_KEY_ALIAS=your_key_alias
            // RELEASE_KEY_PASSWORD=your_key_password
            
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'] ?: 'release.keystore')
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD'] ?: ''
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS'] ?: ''
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD'] ?: ''
            } else {
                // Fallback for development (DO NOT use in production!)
                println "WARNING: keystore.properties not found. Using unsafe default values for development only!"
                storeFile file('release.keystore')
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: 'change-me'
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'change-me'
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: 'change-me'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase Cloud Messaging
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
