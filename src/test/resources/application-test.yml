spring:
  datasource:
    url: jdbc:h2:mem:testdb_${random.uuid}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
