<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${pageTitle} ?: 'OpenFamilyCompass'">OpenFamilyCompass</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <!-- Admin Navigation -->
    <nav th:fragment="adminNav" class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/admin/dashboard">
                <img th:src="@{/images/logo.png}" alt="OpenFamilyCompass"
                    style="width: 32px; height: 32px; margin-right: 0.5rem;">
                Admin Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#"
                            id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img id="navbarAvatar" src="/avatar/current" alt="Avatar" class="rounded-circle me-2"
                                style="width: 32px; height: 32px; object-fit: cover; border: 2px solid white;"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                            <i class="fas fa-user-circle fa-lg me-1" style="display:none;"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">
                                    <i class="fas fa-user"></i>
                                    <span sec:authentication="name">User</span>
                                </h6>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/profile/settings">
                                    <i class="fas fa-cog"></i> <span th:text="#{nav.settings}">Settings</span>
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">Logout</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Parent Navigation -->
    <nav th:fragment="parentNav" class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/parent/dashboard">
                <img th:src="@{/images/logo.png}" alt="OpenFamilyCompass"
                    style="width: 32px; height: 32px; margin-right: 0.5rem;">
                <span th:text="#{nav.parent.dashboard}">Parent Dashboard</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="managementDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-wrench"></i> <span th:text="#{nav.admin.dashboard}">Management</span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="managementDropdown">
                            <li>
                                <a class="dropdown-item" href="/parent/tasks">
                                    <i class="fas fa-tasks text-success"></i> <span th:text="#{nav.tasks}">Tasks</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/parent/rewards">
                                    <i class="fas fa-gift text-danger"></i> <span
                                        th:text="#{nav.rewards}">Rewards</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="/parent/behaviors/manage">
                                    <i class="fas fa-star text-warning"></i> <span
                                        th:text="#{nav.behavior}">Behavior</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#"
                            id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img id="navbarAvatar" src="/avatar/current" alt="Avatar" class="rounded-circle me-2"
                                style="width: 32px; height: 32px; object-fit: cover; border: 2px solid white;"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                            <i class="fas fa-user-circle fa-lg me-1" style="display:none;"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">
                                    <i class="fas fa-user"></i>
                                    <span sec:authentication="name">User</span>
                                </h6>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/profile/settings">
                                    <i class="fas fa-cog"></i> <span th:text="#{nav.settings}">Settings</span>
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">Logout</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Child Navigation -->
    <nav th:fragment="childNav" class="navbar navbar-expand-lg navbar-dark bg-info">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/child/dashboard">
                <img th:src="@{/images/logo.png}" alt="OpenFamilyCompass"
                    style="width: 32px; height: 32px; margin-right: 0.5rem;">
                <span th:text="#{nav.child.dashboard}">Child Dashboard</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#"
                            id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img id="navbarAvatar" src="/avatar/current" alt="Avatar" class="rounded-circle me-2"
                                style="width: 32px; height: 32px; object-fit: cover; border: 2px solid white;"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                            <i class="fas fa-user-circle fa-lg me-1" style="display:none;"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">
                                    <i class="fas fa-user"></i>
                                    <span sec:authentication="name">User</span>
                                </h6>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/profile/settings">
                                    <i class="fas fa-cog"></i> <span th:text="#{nav.settings}">Settings</span>
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt"></i> <span th:text="#{nav.logout}">Logout</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="footer mt-auto py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">© 2025 OpenFamilyCompass</span>
        </div>
    </footer>

    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/app.js}"></script>
        <!-- Token Manager für automatische Wiederanmeldung -->
        <div th:replace="~{fragments/token-manager :: token-manager}"></div>
    </div>
</body>

</html>
