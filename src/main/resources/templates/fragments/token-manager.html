<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Token Manager Fragment</title>
</head>

<body>
    <!-- Token Manager Script Fragment -->
    <th:block th:fragment="token-manager">
        <script th:inline="javascript">
            // Token-Manager: Intelligente Logout-Logik
            (function () {
                const STAY_LOGGED_IN_KEY = 'app_stay_logged_in';
                const REFRESH_TOKEN_KEY = 'app_refresh_token';
                const ACCESS_TOKEN_KEY = 'app_access_token';
                const TOKEN_EXPIRY_KEY = 'app_token_expiry';
                const USERNAME_KEY = 'app_username';

                // Logout-Handler: Löscht ALLE Token bei explizitem Logout
                const logoutForms = document.querySelectorAll('form[action*="/logout"]');
                logoutForms.forEach(form => {
                    form.addEventListener('submit', function (e) {
                        console.log('=== Expliziter Logout - lösche ALLE Token ===');

                        // Bei explizitem Logout IMMER alle Token löschen
                        localStorage.removeItem(ACCESS_TOKEN_KEY);
                        localStorage.removeItem(REFRESH_TOKEN_KEY);
                        localStorage.removeItem(TOKEN_EXPIRY_KEY);
                        localStorage.removeItem(USERNAME_KEY);
                        localStorage.removeItem(STAY_LOGGED_IN_KEY);

                        console.log('✅ Alle Token gelöscht');

                        // Form wird normal submitted (Spring Security kümmert sich um Session)
                    });
                });

                console.log('Token-Manager initialisiert, Logout-Handler registriert für', logoutForms.length, 'Formulare');
            })();
        </script>
    </th:block>
</body>

</html>
