<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">OpenFamilyCompass</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Page-specific styles -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body class="d-flex flex-column min-vh-100" th:attr="data-bs-theme=${userTheme}">
    <!-- Role-based Navbar - always at top -->
    <header>
        <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/navbar :: adminNav}"></div>
        <div sec:authorize="hasRole('PARENT')" th:replace="~{fragments/navbar :: parentNav}"></div>
        <div sec:authorize="hasRole('CHILD')" th:replace="~{fragments/navbar :: childNav}"></div>
    </header>

    <!-- Main content area -->
    <main class="flex-grow-1">
        <div layout:fragment="content">
            <!-- Page content will be inserted here -->
            <div class="container my-4">
                <p class="text-muted">Inhalt wird geladen...</p>
            </div>
        </div>
    </main>

    <!-- Footer - always at bottom -->
    <div th:replace="~{fragments/navbar :: footer}"></div>

    <!-- Scripts - loaded on every page -->
    <div th:replace="~{fragments/navbar :: scripts}"></div>

    <!-- Page-specific scripts -->
    <th:block layout:fragment="scripts"></th:block>

    <!-- Notification scripts -->
    <div th:replace="~{fragments/notifications :: notificationScripts}"></div>
</body>

</html>
