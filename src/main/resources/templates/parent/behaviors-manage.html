<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<div layout:fragment="styles">
    <style>
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 0.5rem !important;
            }

            h2 {
                font-size: 1.5rem !important;
            }

            .card {
                border: none !important;
                border-radius: 0.25rem !important;
                margin-bottom: 1rem !important;
            }

            .card-header {
                padding: 1rem !important;
            }

            .card-body {
                padding: 1rem !important;
            }

            /* Table as Cards on Mobile */
            .behavior-table {
                display: none !important;
            }

            .behavior-card-list {
                display: block !important;
            }

            .behavior-card-item {
                border: 1px solid var(--bs-border-color);
                border-radius: 0.5rem;
                padding: 1rem;
                margin-bottom: 1rem;
                background: var(--bs-card-bg);
            }

            .behavior-card-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 0.75rem;
                gap: 0.5rem;
            }

            .behavior-card-title {
                font-size: 1rem;
                font-weight: 600;
                flex: 1;
            }

            .behavior-card-status {
                flex-shrink: 0;
            }

            .behavior-card-row {
                display: flex;
                justify-content: space-between;
                padding: 0.5rem 0;
                border-bottom: 1px solid var(--bs-border-color);
                font-size: 0.9rem;
            }

            .behavior-card-row:last-of-type {
                border-bottom: none;
            }

            .behavior-card-label {
                color: var(--bs-secondary);
                font-weight: 500;
            }

            .behavior-card-value {
                font-weight: 600;
            }

            .behavior-card-actions {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                margin-top: 1rem;
            }

            .btn {
                padding: 0.75rem 1rem !important;
                font-size: 1rem !important;
                min-height: 44px;
                border-radius: 0.375rem !important;
                width: 100%;
            }

            .btn-sm {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.875rem !important;
                min-height: 40px;
            }

            .d-flex {
                flex-direction: column !important;
                gap: 1rem;
            }

            .d-flex.justify-content-between {
                align-items: flex-start !important;
            }

            .btn-new {
                width: 100% !important;
            }

            .d-inline {
                display: block !important;
                width: 100%;
            }
        }

        @media (max-width: 576px) {
            h2 {
                font-size: 1.25rem !important;
            }

            .btn {
                padding: 0.65rem 0.9rem !important;
                font-size: 0.95rem !important;
            }

            .behavior-card-item {
                padding: 0.75rem;
                margin-bottom: 0.75rem;
            }

            .badge {
                font-size: 0.8rem !important;
                padding: 0.35rem 0.65rem !important;
            }
        }
    </style>
</div>

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><i class="fas fa-star"></i> <span th:text="#{behavior.manage.title}">Manage Behavior</span></h2>
                </div>
                <a href="/parent/behaviors/create" class="btn btn-primary btn-new d-none d-md-inline-block">
                    <i class="fas fa-plus"></i> <span th:text="#{behavior.create}">New Behavior</span>
                </a>
                <a href="/parent/behaviors/create" class="btn btn-primary w-100 d-md-none">
                    <i class="fas fa-plus"></i> <span th:text="#{behavior.create}">New Behavior</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0" th:text="#{behavior.all}">All Behavior Rules</h5>
                    </div>
                    <div class="card-body p-0">
                        <!-- Desktop Table View -->
                        <div class="table-responsive d-none d-md-block">
                            <table class="table table-striped behavior-table mb-0">
                                <thead>
                                    <tr>
                                        <th th:text="#{behavior.title.label}">Title</th>
                                        <th th:text="#{behavior.mantra.label}">Mantra</th>
                                        <th th:text="#{tasks.points}">Points</th>
                                        <th th:text="#{behavior.child.specific}">Child</th>
                                        <th>Status</th>
                                        <th th:text="#{tasks.actions}">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="behavior : ${behaviors}">
                                        <td><strong th:text="${behavior.title}">Titel</strong></td>
                                        <td th:text="${behavior.guideline}">Leitsatz</td>
                                        <td><span class="badge bg-success"
                                                th:text="${behavior.points} + ' ' + #{tasks.points}">0</span></td>
                                        <td
                                            th:text="${behavior.user != null ? behavior.user.firstName : #messages.msg('children.all')}">
                                            Kind</td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${behavior.active} ? 'bg-success' : 'bg-secondary'"
                                                th:text="${behavior.active} ? #{status.active} : #{status.inactive}">Status</span>
                                        </td>
                                        <td th:if="${behavior.active}">
                                            <a th:href="@{/parent/behaviors/{id}/edit(id=${behavior.id})}"
                                                class="btn btn-sm btn-primary">
                                                <i class="fas fa-edit"></i> <span th:text="#{behavior.edit}">Edit</span>
                                            </a>
                                            <form th:action="@{/parent/behaviors/{id}/deactivate(id=${behavior.id})}"
                                                method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-danger"
                                                    th:attr="onclick='return confirm(\'' + #{behavior.deactivate.confirm} + '\');'">
                                                    <i class="fas fa-ban"></i> <span
                                                        th:text="#{behavior.deactivate}">Deactivate</span>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${behaviors.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted" th:text="#{behavior.none}">
                                            No behavior rules
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Mobile Card View -->
                        <div class="behavior-card-list d-md-none p-3">
                            <div th:each="behavior : ${behaviors}" class="behavior-card-item">
                                <div class="behavior-card-header">
                                    <div class="behavior-card-title" th:text="${behavior.title}">Titel</div>
                                    <span class="badge behavior-card-status"
                                        th:classappend="${behavior.active} ? 'bg-success' : 'bg-secondary'"
                                        th:text="${behavior.active} ? #{status.active} : #{status.inactive}">Status</span>
                                </div>

                                <div class="behavior-card-row">
                                    <span class="behavior-card-label" th:text="#{behavior.mantra.label}">Mantra</span>
                                    <span class="behavior-card-value" th:text="${behavior.guideline}">Leitsatz</span>
                                </div>

                                <div class="behavior-card-row">
                                    <span class="behavior-card-label" th:text="#{tasks.points}">Points</span>
                                    <span class="badge bg-success"
                                        th:text="${behavior.points} + ' ' + #{tasks.points}">0</span>
                                </div>

                                <div class="behavior-card-row">
                                    <span class="behavior-card-label" th:text="#{behavior.child.specific}">Child</span>
                                    <span class="behavior-card-value"
                                        th:text="${behavior.user != null ? behavior.user.firstName : #messages.msg('children.all')}">
                                        Kind</span>
                                </div>

                                <div class="behavior-card-actions" th:if="${behavior.active}">
                                    <a th:href="@{/parent/behaviors/{id}/edit(id=${behavior.id})}"
                                        class="btn btn-sm btn-primary">
                                        <i class="fas fa-edit"></i> <span th:text="#{behavior.edit}">Edit</span>
                                    </a>
                                    <form th:action="@{/parent/behaviors/{id}/deactivate(id=${behavior.id})}"
                                        method="post">
                                        <button type="submit" class="btn btn-sm btn-danger w-100"
                                            th:attr="onclick='return confirm(\'' + #{behavior.deactivate.confirm} + '\');'">
                                            <i class="fas fa-ban"></i> <span
                                                th:text="#{behavior.deactivate}">Deactivate</span>
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div th:if="${behaviors.isEmpty()}" class="text-center text-muted p-4">
                                <p th:text="#{behavior.none}">No behavior rules</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
