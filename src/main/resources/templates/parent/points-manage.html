<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/parent/dashboard" th:text="#{nav.parent.dashboard}">Parent
                                Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="/parent/points" th:text="#{points.title}">Points</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${child.firstName}">Child</li>
                    </ol>
                </nav>
                <h2><i class="fas fa-coins"></i> <span th:text="#{points.manage.title}">Manage Points</span> - <span
                        th:text="${child.firstName}">Child</span></h2>
                <p class="text-muted" th:text="#{points.manage.subtitle}">Specify an event and assign plus or minus
                    points.</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <!-- Child Info -->
                        <div class="text-center mb-4">
                            <!-- Avatar Display -->
                            <div class="mb-3">
                                <!-- Photo Avatar -->
                                <img th:if="${child.avatarType == 'PHOTO'}"
                                    th:src="@{/avatar/{userId}(userId=${child.id})}" class="rounded-circle"
                                    style="width: 100px; height: 100px; object-fit: cover; border: 4px solid #007bff;"
                                    alt="Avatar">

                                <!-- Icon Avatar -->
                                <img th:if="${child.avatarType == 'ICON' and child.avatarIconName != null}"
                                    th:src="@{/images/avatars/{icon}.svg(icon=${child.avatarIconName})}"
                                    class="rounded-circle"
                                    style="width: 100px; height: 100px; object-fit: cover; border: 4px solid #007bff; padding: 15px; background: white;"
                                    alt="Avatar">

                                <!-- Default Avatar -->
                                <div th:if="${child.avatarType == 'DEFAULT' or (child.avatarType == 'ICON' and child.avatarIconName == null)}"
                                    class="rounded-circle bg-secondary mx-auto d-inline-flex align-items-center justify-content-center"
                                    style="width: 100px; height: 100px; border: 4px solid #007bff;">
                                    <i class="fas fa-user fa-3x text-white"></i>
                                </div>
                            </div>
                            <h4 th:text="${child.firstName}">Child Name</h4>
                            <p class="text-muted" th:text="#{points.current.points(${child.totalPoints})}">Current
                                points: 0</p>
                        </div>

                        <hr>

                        <!-- Points Form -->
                        <form id="pointsForm" method="post"
                            th:action="@{/parent/points/manage/{childId}(childId=${child.id})}">
                            <input type="hidden" name="childId" th:value="${child.id}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                            <!-- Event/Reason -->
                            <div class="mb-3">
                                <label for="reason" class="form-label" th:text="#{points.event}">Event</label>
                                <input type="text" class="form-control" id="reason" name="reason"
                                    th:placeholder="#{points.event.placeholder}" required>
                            </div>

                            <!-- Type: Bonus or Penalty -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{points.type}">Type of Points</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="type" id="bonus" value="bonus"
                                        checked>
                                    <label class="form-check-label text-success" for="bonus">
                                        <i class="fas fa-plus-circle"></i> <span th:text="#{points.type.bonus}">Plus
                                            Points (Bonus)</span>
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="type" id="penalty"
                                        value="penalty">
                                    <label class="form-check-label text-danger" for="penalty">
                                        <i class="fas fa-minus-circle"></i> <span th:text="#{points.type.penalty}">Minus
                                            Points (Penalty)</span>
                                    </label>
                                </div>
                            </div>

                            <!-- Points Amount -->
                            <div class="mb-3">
                                <label for="points" class="form-label" th:text="#{points.amount}">Points</label>
                                <input type="number" class="form-control" id="points" name="points"
                                    th:placeholder="#{points.amount.placeholder}" min="1" required>
                            </div>

                            <!-- Submit Buttons -->
                            <div class="d-grid gap-2">
                                <button type="submit" id="submitBtn" class="btn btn-success btn-lg">
                                    <i class="fas fa-save"></i> <span th:text="#{button.save}">Save</span>
                                </button>
                                <a href="/parent/points" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> <span th:text="#{button.back}">Back</span>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update submit button based on selection
        document.querySelectorAll('input[name="type"]').forEach(radio => {
            radio.addEventListener('change', function () {
                const submitBtn = document.getElementById('submitBtn');
                if (this.value === 'bonus') {
                    submitBtn.className = 'btn btn-success btn-lg';
                    submitBtn.innerHTML = '<i class="fas fa-plus"></i> <span th:text="#{points.submit.bonus}">Add Plus Points</span>';
                } else {
                    submitBtn.className = 'btn btn-danger btn-lg';
                    submitBtn.innerHTML = '<i class="fas fa-minus"></i> <span th:text="#{points.submit.penalty}">Deduct Minus Points</span>';
                }
            });
        });
    </script>
</body>

</html>
