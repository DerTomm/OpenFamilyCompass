<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-gift"></i> <span th:text="#{rewards.title}">Rewards</span></h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/parent/rewards/create" class="btn btn-danger">
                    <i class="fas fa-plus"></i> <span th:text="#{rewards.create}">Create Reward</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0" th:text="#{rewards.all}">All Rewards</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3" th:each="reward : ${rewards}">
                                <div class="card h-100">
                                    <div class="card-body text-center">
                                        <div class="mb-3" style="font-size: 3rem;">🎁</div>
                                        <h5 class="card-title" th:text="${reward.title}">Belohnung</h5>
                                        <p class="card-text text-muted" th:text="${reward.description}">Beschreibung</p>
                                        <p class="mb-2">
                                            <span class="badge bg-danger" style="font-size: 1.2rem;"
                                                th:text="#{rewards.cost.points(${reward.pointsCost})}">
                                                ⭐ 0 Points
                                            </span>
                                        </p>
                                        <p>
                                            <span class="badge"
                                                th:classappend="${reward.active} ? 'bg-success' : 'bg-secondary'"
                                                th:text="${reward.active} ? #{status.active} : #{status.inactive}">Status</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12" th:if="${rewards.isEmpty()}">
                                <p class="text-center text-muted" th:text="#{rewards.none}">
                                    No rewards available
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
