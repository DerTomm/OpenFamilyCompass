<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head th:replace="~{fragments/navbar :: head}">
</head>

<body>
    <nav th:replace="~{fragments/navbar :: parentNav}"></nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-star"></i> Verhalten bewerten</h2>
                <p class="text-muted">Wähle ein Kind aus, um das Verhalten der aktuellen Woche zu bewerten.</p>
            </div>
        </div>

        <div class="row">
            <div th:each="child : ${children}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="fas fa-user-circle fa-4x text-primary"></i>
                        </div>
                        <h5 class="card-title" th:text="${child.firstName}">Kind</h5>
                        <p class="text-muted mb-3">
                            <small>Aktueller Kontostand: <strong th:text="${child.totalPoints}">0</strong>
                                Punkte</small>
                        </p>
                        <a th:href="@{/parent/behaviors/evaluate/{childId}(childId=${child.id})}"
                            class="btn btn-primary">
                            <i class="fas fa-clipboard-check"></i> Verhalten bewerten
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${children.isEmpty()}" class="col-12">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    Es wurden noch keine Kinder angelegt.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
