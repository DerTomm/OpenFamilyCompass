<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<div layout:fragment="styles">
    <style>
        /* Mobile form optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 0.5rem !important;
            }

            .card {
                border: none !important;
                border-radius: 0.25rem !important;
            }

            .card-header {
                padding: 1rem !important;
            }

            .card-body {
                padding: 1.5rem 1rem !important;
            }

            h4 {
                font-size: 1.25rem !important;
            }

            .form-label {
                font-size: 1rem;
                margin-bottom: 0.75rem;
                font-weight: 500;
            }

            .form-control,
            .form-select {
                font-size: 1rem !important;
                padding: 0.75rem !important;
                min-height: 44px;
                border-radius: 0.375rem;
            }

            textarea.form-control {
                min-height: 100px !important;
            }

            .form-text {
                font-size: 0.85rem;
                margin-top: 0.25rem;
            }

            .btn {
                padding: 0.75rem 1rem !important;
                font-size: 1rem !important;
                min-height: 44px;
                border-radius: 0.375rem !important;
            }

            .d-grid {
                display: flex;
                flex-direction: column !important;
                gap: 0.5rem;
            }

            .d-md-flex,
            .d-md-end {
                flex-direction: column !important;
                gap: 0.5rem;
            }

            .btn-block {
                width: 100%;
            }

            .alert {
                padding: 0.75rem;
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 1rem !important;
            }

            h4 {
                font-size: 1.1rem !important;
            }

            .form-control,
            .form-select {
                font-size: 0.95rem !important;
                padding: 0.65rem !important;
            }

            .btn {
                padding: 0.65rem 0.9rem !important;
                font-size: 0.95rem !important;
            }
        }
    </style>
</div>

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="mb-0"><i class="fas fa-edit"></i> <span th:text="#{behavior.edit.title}">Edit
                                Behavior</span></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/behaviors/{id}/edit(id=${behavior.id})}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label"
                                    th:text="#{behavior.evaluate.title} + ' *'">Title</label>
                                <input type="text" class="form-control" id="title" name="title"
                                    th:value="${behavior.evaluate.title}"
                                    th:placeholder="#{behavior.evaluate.title.hint}" required>
                                <div class="form-text" th:text="#{behavior.evaluate.title.hint}">A short, concise title
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="guideline" class="form-label"
                                    th:text="#{behavior.guidelines.label} + ' *'">Mantra</label>
                                <textarea class="form-control" id="guideline" name="guideline" rows="3"
                                    th:placeholder="#{behavior.guidelines.hint}" required
                                    th:text="${behavior.guideline}"></textarea>
                                <div class="form-text" th:text="#{behavior.guidelines.hint}">A guiding principle</div>
                            </div>

                            <div class="mb-3">
                                <label for="points" class="form-label"
                                    th:text="#{behavior.points.label} + ' *'">Points</label>
                                <input type="number" class="form-control" id="points" name="points" min="1"
                                    th:value="${behavior.points}" required>
                                <div class="form-text" th:text="#{behavior.points.hint}">How many points</div>
                            </div>

                            <div class="mb-3">
                                <label for="childId" class="form-label" th:text="#{behavior.child.label}">Child
                                    (optional)</label>
                                <select class="form-select" id="childId" name="childId">
                                    <option value="" th:text="#{children.all}">All Children</option>
                                    <option th:each="child : ${children}" th:value="${child.id}"
                                        th:text="${child.firstName}"
                                        th:selected="${behavior.user != null && behavior.user.id == child.id}">Kind
                                    </option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/parent/behaviors/manage" class="btn btn-secondary"
                                    th:text="#{button.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> <span th:text="#{button.save}">Save
                                        Behavior</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
