<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-tasks"></i> <span th:text="#{tasks.title}">Task Management</span></h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/parent/tasks/create" class="btn btn-success">
                    <i class="fas fa-plus"></i> <span th:text="#{tasks.create}">Create Task</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Aufgabenverwaltung</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(taskDefinitions)}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Es wurden noch keine Aufgabendefinitionen erstellt.
                        </div>
                        <div th:if="${not #lists.isEmpty(taskDefinitions)}">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Titel</th>
                                            <th>Beschreibung</th>
                                            <th>Punkte</th>
                                            <th>Kinder</th>
                                            <th>Wiederholung</th>
                                            <th>Startdatum</th>
                                            <th>Aktionen</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="taskDef : ${taskDefinitions}">
                                            <td th:text="${taskDef.title}"></td>
                                            <td th:text="${taskDef.description} ?: '-'"></td>
                                            <td th:text="${taskDef.basePoints}"></td>
                                            <td>
                                                <span th:if="${taskDef.assignedUsers.size() == children.size()}"
                                                    th:text="#{tasks.assignment.all}"></span>
                                                <span th:if="${taskDef.assignedUsers.size() == 1}"
                                                    th:text="${taskDef.assignedUsers[0].firstName}"></span>
                                                <span
                                                    th:if="${taskDef.assignedUsers.size() > 1 and taskDef.assignedUsers.size() < children.size()}"
                                                    th:text="#{tasks.assignment.some}"></span>
                                            </td>
                                            <td>
                                                <span th:if="${taskDef.recurrenceType.name() == 'ONCE'}"
                                                    th:text="#{recurrence.once}">Einmalig</span>
                                                <span th:if="${taskDef.recurrenceType.name() != 'ONCE'}"
                                                    th:text="#{recurrence.weekly}">Wöchentlich</span>
                                            </td>
                                            <td th:text="${taskDef.startDate} ?: '-'"></td>
                                            <td>
                                                <a th:href="@{'/parent/tasks/' + ${taskDef.id} + '/edit'}"
                                                    class="btn btn-sm btn-primary">Bearbeiten</a>
                                                <form th:action="@{'/parent/tasks/' + ${taskDef.id} + '/delete'}"
                                                    method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-sm btn-danger"
                                                        onclick="return confirm('Wirklich löschen?')">Löschen</button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
