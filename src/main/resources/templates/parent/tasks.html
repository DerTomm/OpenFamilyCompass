<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-tasks"></i> <span th:text="#{tasks.title}">Task Management</span></h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/parent/tasks/create" class="btn btn-success">
                    <i class="fas fa-plus"></i> <span th:text="#{tasks.create}">Create Task</span>
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Aufgabenverwaltung</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(tasks)}" class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Es wurden noch keine Aufgaben erstellt.
                        </div>
                        <div th:if="${not #lists.isEmpty(tasks)}">
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Titel</th>
                                            <th>Beschreibung</th>
                                            <th>Punkte</th>
                                            <th>Kind</th>
                                            <th>Status</th>
                                            <th>Wiederholung</th>
                                            <th>Fällig am</th>
                                            <th>Aktionen</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="task : ${tasks}">
                                            <td th:text="${task.title}"></td>
                                            <td th:text="${task.description} ?: '-'"></td>
                                            <td th:text="${task.basePoints}"></td>
                                            <td
                                                th:text="${task.assignedUser != null ? task.assignedUser.firstName : 'Alle'}">
                                            </td>
                                            <td>
                                                <span
                                                    th:attr="class=${task.status.name() == 'PENDING' ? 'badge bg-warning' : task.status.name() == 'IN_PROGRESS' ? 'badge bg-primary' : task.status.name() == 'CHILD_COMPLETED' ? 'badge bg-info' : task.status.name() == 'APPROVED' ? 'badge bg-success' : 'badge bg-danger'}"
                                                    th:text="#{${'task.status.' + task.status.name()}}"></span>
                                            </td>
                                            <td
                                                th:text="${task.recurrenceType.name() == 'ONCE' ? 'Einmalig' : task.recurrenceType.name() == 'DAILY' ? 'Täglich' : task.recurrenceType.name() == 'WEEKLY' ? 'Wöchentlich' : 'Monatlich'}">
                                            </td>
                                            <td
                                                th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'dd.MM.yyyy') : '-'}">
                                            </td>
                                            <td>
                                                <a th:if="${task.status.name() != 'APPROVED' and task.status.name() != 'CHILD_COMPLETED'}"
                                                    th:href="@{'/parent/tasks/' + ${task.id} + '/edit'}"
                                                    class="btn btn-sm btn-outline-primary me-2">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form
                                                    th:if="${task.status.name() != 'APPROVED' and task.status.name() != 'CHILD_COMPLETED'}"
                                                    th:action="@{'/parent/tasks/' + ${task.id} + '/delete'}"
                                                    method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                                        onclick="return confirm('Sind Sie sicher, dass Sie diese Aufgabe löschen möchten?')">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
