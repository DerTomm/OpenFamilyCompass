<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: head}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: parentNav}"></nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-tasks"></i> Aufgabenverwaltung</h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/parent/tasks/create" class="btn btn-success">
                    <i class="fas fa-plus"></i> Neue Aufgabe / Vorlage
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Aufgaben-Vorlagen</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Titel</th>
                                        <th>Beschreibung</th>
                                        <th>Punkte</th>
                                        <th>Kind</th>
                                        <th>Wiederholung</th>
                                        <th>Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="task : ${templates}">
                                        <td th:text="${task.title}">Titel</td>
                                        <td th:text="${task.description}">Beschreibung</td>
                                        <td><span class="badge bg-success" th:text="${task.basePoints}">0</span></td>
                                        <td th:text="${task.assignedChild != null ? task.assignedChild.firstName : 'Alle'}">Kind</td>
                                        <td>
                                            <span class="badge bg-info" th:text="${task.recurrenceType}">Type</span>
                                        </td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary" disabled>
                                                <i class="fas fa-edit"></i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${templates.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted">
                                            Keine Vorlagen vorhanden. Erstelle die erste Aufgabe!
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
