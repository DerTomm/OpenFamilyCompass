<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head th:replace="~{fragments/navbar :: head}">
</head>

<body>
    <nav th:replace="~{fragments/navbar :: parentNav}"></nav>

    <div class="container my-4">
        <h2 class="mb-4"><i class="fas fa-home"></i> Dashboard</h2>

        <!-- Quick Actions -->
        <div class="row mb-4">
            <div class="col-12 mb-3">
                <h4><i class="fas fa-bolt"></i> Schnellaktionen</h4>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0"><i class="fas fa-check-circle"></i> Aufgaben genehmigen</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Warten auf Genehmigung: <strong th:text="${pendingApprovals.size()}">0</strong>
                        </p>
                        <a href="/parent/tasks/pending" class="btn btn-warning">Aufgaben prüfen</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-gift"></i> Belohnungen genehmigen</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Warten auf Genehmigung: <strong
                                th:text="${pendingRedemptions.size()}">0</strong></p>
                        <a href="/parent/redemptions/pending" class="btn btn-info text-white">Belohnungen prüfen</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-star"></i> Verhalten bewerten</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Belohne positives Verhalten deiner Kinder</p>
                        <a href="/parent/behaviors" class="btn btn-success">Verhalten bewerten</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Children Overview -->
        <div class="row mt-5">
            <div class="col-12 mb-3">
                <h4><i class="fas fa-users"></i> Meine Kinder</h4>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3" th:each="child : ${children}">
                                <div class="card border-success">
                                    <div class="card-body text-center">
                                        <!-- Avatar Display -->
                                        <div class="mb-2">
                                            <!-- Photo Avatar -->
                                            <img th:if="${child.user != null and child.user.avatarType == 'PHOTO'}"
                                                th:src="@{/avatar/{userId}(userId=${child.user.id})}"
                                                class="rounded-circle"
                                                style="width: 100px; height: 100px; object-fit: cover; border: 3px solid #28a745;"
                                                alt="Avatar">

                                            <!-- Icon Avatar -->
                                            <img th:if="${child.user != null and child.user.avatarType == 'ICON' and child.user.avatarIconName != null}"
                                                th:src="@{/images/avatars/{icon}.svg(icon=${child.user.avatarIconName})}"
                                                class="rounded-circle"
                                                style="width: 100px; height: 100px; object-fit: cover; border: 3px solid #28a745; padding: 10px; background: white;"
                                                alt="Avatar">

                                            <!-- Default Avatar -->
                                            <div th:if="${child.user == null or child.user.avatarType == 'DEFAULT' or (child.user.avatarType == 'ICON' and child.user.avatarIconName == null)}"
                                                class="rounded-circle bg-secondary mx-auto d-inline-flex align-items-center justify-content-center"
                                                style="width: 100px; height: 100px; border: 3px solid #28a745;">
                                                <i class="fas fa-user fa-3x text-white"></i>
                                            </div>
                                        </div>

                                        <h4 th:text="${child.firstName}">Kind</h4>
                                        <p class="mb-3">
                                            <span class="badge bg-success" style="font-size: 1.5rem;">
                                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                                            </span>
                                        </p>
                                        <a th:href="@{/parent/children/{id}(id=${child.id})}"
                                            class="btn btn-success">Details anzeigen</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
