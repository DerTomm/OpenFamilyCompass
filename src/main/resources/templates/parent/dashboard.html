<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head th:replace="~{fragments/navbar :: head}">
</head>

<body>
    <nav th:replace="~{fragments/navbar :: parentNav}"></nav>

    <div class="container my-4">
        <h2 class="mb-4"><i class="fas fa-home"></i> <span th:text="#{dashboard.title}">Dashboard</span></h2>

        <!-- Quick Actions -->
        <div class="row mb-4">
            <div class="col-12 mb-3">
                <h4><i class="fas fa-bolt"></i> <span th:text="#{dashboard.quick.actions}">Quick Actions</span></h4>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0"><i class="fas fa-check-circle"></i> <span
                                th:text="#{dashboard.approve.tasks}">Approve Tasks</span></h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2" th:text="#{dashboard.approve.tasks.pending(${pendingApprovals.size()})}">
                            Awaiting approval: 0</p>
                        <a href="/parent/tasks/pending" class="btn btn-warning"
                            th:text="#{dashboard.approve.tasks.button}">Check Tasks</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-gift"></i> <span
                                th:text="#{dashboard.approve.rewards}">Approve Rewards</span></h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2" th:text="#{dashboard.approve.rewards.pending(${pendingRedemptions.size()})}">
                            Awaiting approval: 0</p>
                        <a href="/parent/redemptions/pending" class="btn btn-info text-white"
                            th:text="#{dashboard.approve.rewards.button}">Check Rewards</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-star"></i> <span
                                th:text="#{dashboard.evaluate.behavior}">Evaluate Behavior</span></h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2" th:text="#{dashboard.evaluate.behavior.desc}">Reward your children's positive
                            behavior</p>
                        <a href="/parent/behaviors" class="btn btn-success"
                            th:text="#{dashboard.evaluate.behavior.button}">Evaluate Behavior</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Children Overview -->
        <div class="row mt-5">
            <div class="col-12 mb-3">
                <h4><i class="fas fa-users"></i> <span th:text="#{dashboard.children.overview}">Children Overview</span>
                </h4>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 col-lg-4 mb-3" th:each="child : ${children}">
                                <div class="card border-success h-100">
                                    <div class="card-body">
                                        <!-- Avatar Display -->
                                        <div class="text-center mb-2">
                                            <!-- Photo Avatar -->
                                            <img th:if="${child.user != null and child.user.avatarType == 'PHOTO'}"
                                                th:src="@{/avatar/{userId}(userId=${child.user.id})}"
                                                class="rounded-circle"
                                                style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #28a745;"
                                                alt="Avatar">

                                            <!-- Icon Avatar -->
                                            <img th:if="${child.user != null and child.user.avatarType == 'ICON' and child.user.avatarIconName != null}"
                                                th:src="@{/images/avatars/{icon}.svg(icon=${child.user.avatarIconName})}"
                                                class="rounded-circle"
                                                style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #28a745; padding: 10px; background: white;"
                                                alt="Avatar">

                                            <!-- Default Avatar -->
                                            <div th:if="${child.user == null or child.user.avatarType == 'DEFAULT' or (child.user.avatarType == 'ICON' and child.user.avatarIconName == null)}"
                                                class="rounded-circle bg-secondary mx-auto d-inline-flex align-items-center justify-content-center"
                                                style="width: 80px; height: 80px; border: 3px solid #28a745;">
                                                <i class="fas fa-user fa-2x text-white"></i>
                                            </div>
                                        </div>

                                        <h5 class="text-center mb-1" th:text="${child.firstName}">Kind</h5>
                                        <p class="text-center mb-3">
                                            <span class="badge bg-success">
                                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                                            </span>
                                        </p>

                                        <hr>

                                        <!-- Bonuspunkte -->
                                        <div class="mb-3">
                                            <h6 class="text-success mb-2">
                                                <i class="fas fa-plus-circle"></i> <span
                                                    th:text="#{dashboard.bonus.points}">Bonus Points</span>
                                            </h6>
                                            <form th:action="@{/parent/points/bonus}" method="post">
                                                <input type="hidden" name="childId" th:value="${child.id}">
                                                <div class="input-group input-group-sm mb-2">
                                                    <input type="text" class="form-control" name="reason"
                                                        th:placeholder="#{dashboard.bonus.points.reason}" required>
                                                    <input type="number" class="form-control" name="points"
                                                        th:placeholder="#{dashboard.bonus.points.amount}" min="1"
                                                        style="max-width: 80px;" required>
                                                    <button type="submit" class="btn btn-success btn-sm">
                                                        <i class="fas fa-plus"></i>
                                                    </button>
                                                </div>
                                            </form>
                                        </div>

                                        <!-- Strafpunkte -->
                                        <div class="mb-3">
                                            <h6 class="text-danger mb-2">
                                                <i class="fas fa-minus-circle"></i> <span
                                                    th:text="#{dashboard.penalty.points}">Penalty Points</span>
                                            </h6>
                                            <form th:action="@{/parent/points/penalty}" method="post">
                                                <input type="hidden" name="childId" th:value="${child.id}">
                                                <div class="input-group input-group-sm mb-2">
                                                    <input type="text" class="form-control" name="reason"
                                                        th:placeholder="#{dashboard.penalty.points.reason}" required>
                                                    <input type="number" class="form-control" name="points"
                                                        th:placeholder="#{dashboard.penalty.points.amount}" min="1"
                                                        style="max-width: 80px;" required>
                                                    <button type="submit" class="btn btn-danger btn-sm">
                                                        <i class="fas fa-minus"></i>
                                                    </button>
                                                </div>
                                            </form>
                                        </div>

                                        <a th:href="@{/parent/children/{id}(id=${child.id})}"
                                            class="btn btn-outline-success btn-sm w-100">
                                            <i class="fas fa-info-circle"></i> <span
                                                th:text="#{children.details}">Details</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
</body>

</html>
