<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<head>
    <title th:text="#{dashboard.title}">Dashboard</title>
    <th:block layout:fragment="styles">
        <style>
            /* Light mode - default background */
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }

            .parent-card {
                background: white;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                color: inherit;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                transition: transform 0.2s;
            }

            .parent-card:hover {
                transform: translateY(-5px);
            }

            /* Ensure all quick action cards have the same height */
            .quick-action-card {
                min-height: 220px;
            }

            .child-overview-card {
                background: white;
                border-radius: 15px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                color: inherit;
                transition: transform 0.2s;
            }

            .child-overview-card:hover {
                transform: translateY(-3px);
            }

            /* Dark mode support */
            [data-bs-theme="dark"] body {
                background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%);
            }

            [data-bs-theme="dark"] .parent-card {
                background: var(--bs-dark-bg-subtle);
                border: 1px solid var(--bs-border-color);
            }

            [data-bs-theme="dark"] .child-overview-card {
                background: var(--bs-dark-bg-subtle);
                border: 1px solid var(--bs-border-color);
            }

            [data-bs-theme="dark"] .card {
                background-color: var(--bs-dark-bg-subtle);
                border-color: var(--bs-border-color);
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-body {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-title {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] h2,
            [data-bs-theme="dark"] h3,
            [data-bs-theme="dark"] h4 {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .text-muted {
                color: var(--bs-secondary-color) !important;
            }

            /* Mobile optimizations */
            @media (max-width: 768px) {
                .quick-action-card {
                    min-height: auto;
                }

                .parent-card {
                    border-radius: 10px;
                    padding: 1rem !important;
                }

                .child-overview-card {
                    border-radius: 10px;
                    padding: 1rem !important;
                }

                h2 {
                    font-size: 1.35rem !important;
                }

                h3 {
                    font-size: 1.15rem !important;
                }

                .btn {
                    min-height: 44px;
                    font-size: 0.95rem;
                }

                /* Avatar sizing */
                img.rounded-circle {
                    width: 70px !important;
                    height: 70px !important;
                }

                .rounded-circle {
                    width: 70px !important;
                    height: 70px !important;
                }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container my-4">
            <h2 class="mb-4 text-white text-center"><i class="fas fa-home"></i> <span
                    th:text="#{dashboard.title}">Dashboard</span></h2>

            <!-- Quick Actions -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <a href="/parent/tasks/pending" class="text-decoration-none">
                        <div class="parent-card quick-action-card p-4 text-center">
                            <i class="fas fa-check-circle fa-4x text-warning mb-3"></i>
                            <h4 th:text="#{dashboard.approve.tasks}">Approve Tasks</h4>
                            <p class="mb-0 text-muted"
                                th:text="#{dashboard.approve.tasks.pending(${pendingApprovals.size()})}">0
                                pending</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-3 mb-3">
                    <a href="/parent/redemptions/pending" class="text-decoration-none">
                        <div class="parent-card quick-action-card p-4 text-center">
                            <i class="fas fa-gift fa-4x text-info mb-3"></i>
                            <h4 th:text="#{dashboard.approve.rewards}">Approve Rewards</h4>
                            <p class="mb-0 text-muted"
                                th:text="#{dashboard.approve.rewards.pending(${pendingRedemptions.size()})}">0
                                pending</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-3 mb-3">
                    <a href="/parent/behaviors" class="text-decoration-none">
                        <div class="parent-card quick-action-card p-4 text-center">
                            <i class="fas fa-star fa-4x text-success mb-3"></i>
                            <h4 th:text="#{dashboard.evaluate.behavior}">Evaluate Behavior</h4>
                            <p class="mb-0 text-muted" th:text="#{dashboard.evaluate.behavior.desc}">Reward positive
                                behavior</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-3 mb-3">
                    <a href="/parent/points" class="text-decoration-none">
                        <div class="parent-card quick-action-card p-4 text-center">
                            <i class="fas fa-coins fa-4x text-primary mb-3"></i>
                            <h4 th:text="#{dashboard.manage.points}">Bonus and Penalty Points</h4>
                            <p class="mb-0 text-muted" th:text="#{dashboard.manage.points.desc}">Manage points</p>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Children Overview -->
            <div class="row">
                <div class="col-12 mb-3">
                    <h3 class="text-white text-center"><i class="fas fa-users"></i> <span
                            th:text="#{dashboard.children.overview}">Children Overview</span></h3>
                </div>
                <div class="col-md-6 col-lg-4 mb-3" th:each="child : ${children}">
                    <a th:href="@{/parent/children/{id}(id=${child.id})}" class="text-decoration-none">
                        <div class="child-overview-card p-3 text-center">
                            <!-- Avatar Display -->
                            <div class="mb-2">
                                <!-- Photo Avatar -->
                                <img th:if="${child.avatarType == 'PHOTO'}"
                                    th:src="@{/avatar/{userId}(userId=${child.id})}" class="rounded-circle"
                                    style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #28a745;"
                                    alt="Avatar">

                                <!-- Icon Avatar -->
                                <img th:if="${child.avatarType == 'ICON' and child.avatarIconName != null}"
                                    th:src="@{/images/avatars/{icon}.svg(icon=${child.avatarIconName})}"
                                    class="rounded-circle"
                                    style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #28a745; padding: 10px; background: white;"
                                    alt="Avatar">

                                <!-- Default Avatar -->
                                <div th:if="${child.avatarType == 'DEFAULT' or (child.avatarType == 'ICON' and child.avatarIconName == null)}"
                                    class="rounded-circle bg-secondary mx-auto d-inline-flex align-items-center justify-content-center"
                                    style="width: 80px; height: 80px; border: 3px solid #28a745;">
                                    <i class="fas fa-user fa-2x text-white"></i>
                                </div>
                            </div>

                            <h5 class="mb-1" th:text="${child.firstName}">Kind</h5>
                            <p class="mb-0">
                                ⭐ <span th:text="${child.totalPoints != null ? child.totalPoints : 0}">0</span> Punkte
                            </p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
