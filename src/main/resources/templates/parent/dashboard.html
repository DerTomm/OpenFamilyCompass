<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eltern Dashboard - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/parent/dashboard">👨‍👩‍👧‍👦 Eltern Dashboard</a>
            <div class="navbar-nav ms-auto">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Quick Actions -->
        <div class="row mb-4">
            <div class="col-md-4 mb-3">
                <div class="card border-warning">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0"><i class="fas fa-check-circle"></i> Aufgaben genehmigen</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Warten auf Genehmigung: <strong th:text="${pendingApprovals.size()}">0</strong></p>
                        <a href="/parent/tasks/pending" class="btn btn-warning">Aufgaben prüfen</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-gift"></i> Belohnungen genehmigen</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Warten auf Genehmigung: <strong th:text="${pendingRedemptions.size()}">0</strong></p>
                        <a href="/parent/redemptions/pending" class="btn btn-info text-white">Belohnungen prüfen</a>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card border-success">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-star"></i> Verhalten bewerten</h5>
                    </div>
                    <div class="card-body">
                        <p class="mb-2">Belohne positives Verhalten deiner Kinder</p>
                        <a href="/parent/behaviors" class="btn btn-success">Verhalten bewerten</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Children Overview -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-users"></i> Meine Kinder</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3" th:each="child : ${children}">
                                <div class="card border-success">
                                    <div class="card-body text-center">
                                        <div th:if="${child.avatarPath}">
                                            <img th:src="@{${child.avatarPath}}" 
                                                 class="rounded-circle mb-2" 
                                                 style="width: 100px; height: 100px;"
                                                 alt="Avatar">
                                        </div>
                                        <div th:unless="${child.avatarPath}" 
                                             class="rounded-circle bg-secondary mx-auto mb-2" 
                                             style="width: 100px; height: 100px; line-height: 100px; font-size: 3rem;">
                                            👤
                                        </div>
                                        <h4 th:text="${child.firstName}">Kind</h4>
                                        <p class="mb-3">
                                            <span class="badge bg-success" style="font-size: 1.5rem;">
                                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                                            </span>
                                        </p>
                                        <a th:href="@{/parent/children/{id}(id=${child.id})}" 
                                           class="btn btn-success">Details anzeigen</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
