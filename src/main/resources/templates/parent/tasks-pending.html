<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgaben genehmigen - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/parent/dashboard">👨‍👩‍👧‍👦 Eltern Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/parent/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-check-circle"></i> Aufgaben genehmigen</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-12" th:each="task : ${tasks}">
                <div class="card mb-3">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0" th:text="${task.assignedChild.firstName} + ': ' + ${task.title}">Kind: Aufgabe</h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text" th:text="${task.description}">Beschreibung</p>
                        <p>
                            <strong>Basis-Punkte:</strong> 
                            <span class="badge bg-success" th:text="${task.basePoints}">0</span>
                        </p>
                        <p>
                            <strong>Abgeschlossen am:</strong> 
                            <span th:text="${#temporals.format(task.completedAt, 'dd.MM.yyyy HH:mm')}">Datum</span>
                        </p>
                        
                        <hr>
                        
                        <form th:action="@{/parent/tasks/{id}/approve(id=${task.id})}" method="post" class="mb-2">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="awardedPoints" class="form-label">Vergebene Punkte:</label>
                                    <input type="number" class="form-control" name="awardedPoints" 
                                           th:value="${task.basePoints}" min="0" required>
                                </div>
                                <div class="col-md-8">
                                    <label for="notes" class="form-label">Notizen (optional):</label>
                                    <input type="text" class="form-control" name="notes" 
                                           placeholder="z.B. Super gemacht!">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success mt-2">
                                <i class="fas fa-check"></i> Genehmigen
                            </button>
                        </form>
                        
                        <form th:action="@{/parent/tasks/{id}/reject(id=${task.id})}" method="post">
                            <div class="row">
                                <div class="col-12">
                                    <label for="notes" class="form-label">Grund für Ablehnung:</label>
                                    <input type="text" class="form-control" name="notes" required 
                                           placeholder="z.B. Zimmer noch nicht richtig aufgeräumt">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-danger mt-2">
                                <i class="fas fa-times"></i> Ablehnen
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-12" th:if="${tasks.isEmpty()}">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> Keine Aufgaben warten auf Genehmigung.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
