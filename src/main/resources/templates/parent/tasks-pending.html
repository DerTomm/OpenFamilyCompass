<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-check-circle"></i> <span th:text="#{tasks.pending.title}">Approve Tasks</span></h2>
            </div>
        </div>

        <div class="row">
            <div class="col-12" th:each="task : ${tasks}">
                <div class="card mb-3">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0" th:text="${task.assignedUser.firstName + ': ' + task.title}">Kind: Aufgabe
                        </h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text" th:text="${task.description}">Beschreibung</p>
                        <p>
                            <strong th:text="#{tasks.pending.base.points}">Base Points:</strong>
                            <span class="badge bg-success" th:text="${task.basePoints}">0</span>
                        </p>
                        <p>
                            <strong th:text="#{tasks.pending.completed.at}">Completed at:</strong>
                            <span th:text="${#temporals.format(task.completedAt, 'dd.MM.yyyy HH:mm')}">Datum</span>
                        </p>

                        <hr>

                        <form th:action="@{/parent/tasks/{id}/approve(id=${task.id})}" method="post" class="mb-2">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="awardedPoints" class="form-label"
                                        th:text="#{tasks.pending.award.points}">Awarded Points:</label>
                                    <input type="number" class="form-control" name="awardedPoints"
                                        th:value="${task.basePoints}" min="0" required>
                                </div>
                                <div class="col-md-8">
                                    <label for="notes" class="form-label"
                                        th:text="#{tasks.pending.parent.comment}">Parent Comment (optional):</label>
                                    <input type="text" class="form-control" name="notes"
                                        th:placeholder="#{tasks.pending.parent.comment}">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success mt-2">
                                <i class="fas fa-check"></i> <span th:text="#{tasks.pending.approve}">Approve</span>
                            </button>
                        </form>

                        <form th:action="@{/parent/tasks/{id}/reject(id=${task.id})}" method="post">
                            <div class="row">
                                <div class="col-12">
                                    <label for="notes" class="form-label">Grund für Ablehnung:</label>
                                    <input type="text" class="form-control" name="notes" required
                                        placeholder="z.B. Zimmer noch nicht richtig aufgeräumt">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-danger mt-2">
                                <i class="fas fa-times"></i> <span th:text="#{tasks.pending.reject}">Reject</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${tasks.isEmpty()}">
                <div class="alert alert-info" th:utext="#{tasks.pending.none}">
                    <i class="fas fa-info-circle"></i> No tasks awaiting approval.
                </div>
            </div>
        </div>
    </div>
</body>

</html>
