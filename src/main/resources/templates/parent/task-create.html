<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-plus"></i> <span th:text="#{task.create.title}">Create New
                                Task</span></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/tasks/create}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label" th:text="#{task.name}">Task Name</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label"
                                    th:text="#{task.description}">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="basePoints" class="form-label" th:text="#{task.points.label}">Reward
                                    Points</label>
                                <input type="number" class="form-control" id="basePoints" name="basePoints" min="1"
                                    value="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="assignedUsers" class="form-label">Zugewiesene Kinder</label>
                                <div class="form-check" th:each="child : ${children}">
                                    <input class="form-check-input" type="checkbox" th:id="'child' + ${child.id}"
                                        name="userIds" th:value="${child.id}">
                                    <label class="form-check-label" th:for="'child' + ${child.id}"
                                        th:text="${child.firstName}">Kind</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="recurrenceType" class="form-label">Wiederholung</label>
                                <select class="form-select" id="recurrenceType" name="recurrenceType" required
                                    onchange="toggleWeeklyDays(); updateLabels();">
                                    <option th:each="type : ${recurrenceTypes}" th:value="${type}">
                                        <span th:if="${type.name() == 'ONCE'}"
                                            th:text="#{recurrence.once}">Einmalig</span>
                                        <span th:if="${type.name() != 'ONCE'}"
                                            th:text="#{recurrence.weekly}">Wöchentlich</span>
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3" id="weeklyDaysDiv" style="display: none;">
                                <label class="form-label">Wochentage (für wöchentliche Aufgaben)</label>
                                <div th:with="mondayLabel=#{day.monday},tuesdayLabel=#{day.tuesday},wednesdayLabel=#{day.wednesday},thursdayLabel=#{day.thursday},fridayLabel=#{day.friday},saturdayLabel=#{day.saturday},sundayLabel=#{day.sunday}"
                                    class="row">
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="monday" name="weeklyDay"
                                                value="MONDAY">
                                            <label class="form-check-label" for="monday"
                                                th:text="${#strings.substring(mondayLabel, 0, 2)}">Mo</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="tuesday"
                                                name="weeklyDay" value="TUESDAY">
                                            <label class="form-check-label" for="tuesday"
                                                th:text="${#strings.substring(tuesdayLabel, 0, 2)}">Di</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="wednesday"
                                                name="weeklyDay" value="WEDNESDAY">
                                            <label class="form-check-label" for="wednesday"
                                                th:text="${#strings.substring(wednesdayLabel, 0, 2)}">Mi</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="thursday"
                                                name="weeklyDay" value="THURSDAY">
                                            <label class="form-check-label" for="thursday"
                                                th:text="${#strings.substring(thursdayLabel, 0, 2)}">Do</label>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="friday" name="weeklyDay"
                                                value="FRIDAY">
                                            <label class="form-check-label" for="friday"
                                                th:text="${#strings.substring(fridayLabel, 0, 2)}">Fr</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="saturday"
                                                name="weeklyDay" value="SATURDAY">
                                            <label class="form-check-label" for="saturday"
                                                th:text="${#strings.substring(saturdayLabel, 0, 2)}">Sa</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="sunday" name="weeklyDay"
                                                value="SUNDAY">
                                            <label class="form-check-label" for="sunday"
                                                th:text="${#strings.substring(sundayLabel, 0, 2)}">So</label>
                                        </div>
                                    </div>
                                </div>
                                <input type="hidden" name="weeklyDays" id="weeklyDaysHidden">
                            </div>

                            <div class="mb-3">
                                <label for="startDate" class="form-label" id="startDateLabel">Startdatum</label>
                                <input type="date" class="form-control" id="startDate" name="startDate"
                                    th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}">
                                <small class="form-text text-muted" id="startDateHelp">Standard: Heute. Für einmalige
                                    Aufgaben ist dies das Datum der Aufgabe.</small>
                            </div>

                            <div class="mb-3">
                                <label for="endDate" class="form-label">Enddatum (optional)</label>
                                <input type="date" class="form-control" id="endDate" name="endDate">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-save"></i> <span th:text="#{task.create.button}">Create Task</span>
                                </button>
                                <a href="/parent/tasks" class="btn btn-outline-secondary"
                                    th:text="#{button.cancel}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            function toggleWeeklyDays() {
                const recurrenceType = document.getElementById('recurrenceType').value;
                const weeklyDaysDiv = document.getElementById('weeklyDaysDiv');

                if (recurrenceType === 'WEEKLY') {
                    weeklyDaysDiv.style.display = 'block';
                } else {
                    // Wenn von WEEKLY zu ONCE gewechselt wird, Checkboxen deaktivieren und Feld leeren
                    weeklyDaysDiv.style.display = 'none';
                    const checkboxes = document.querySelectorAll('input[name="weeklyDay"]');
                    checkboxes.forEach(cb => cb.checked = false);
                    document.getElementById('weeklyDaysHidden').value = '';
                }
            }

            function updateWeeklyDays() {
                const checkboxes = document.querySelectorAll('input[name="weeklyDay"]:checked');
                const selectedDays = Array.from(checkboxes).map(cb => cb.value);
                document.getElementById('weeklyDaysHidden').value = selectedDays.join(',');
            }

            function updateLabels() {
                const recurrenceType = document.getElementById('recurrenceType').value;
                const label = document.getElementById('startDateLabel');
                const help = document.getElementById('startDateHelp');
                if (recurrenceType === 'ONCE') {
                    label.textContent = 'Datum';
                    help.textContent = 'Datum der einmaligen Aufgabe.';
                } else {
                    label.textContent = 'Startdatum';
                    help.textContent = 'Standard: Heute. Datum, ab dem wiederkehrende Aufgaben erstellt werden.';
                }
            }

            document.getElementById('recurrenceType').addEventListener('change', function () {
                toggleWeeklyDays();
                updateLabels();
            });

            // Update weeklyDays on checkbox change
            document.addEventListener('change', function (e) {
                if (e.target.name === 'weeklyDay') {
                    updateWeeklyDays();
                }
            });

            // Update weeklyDays before form submission
            document.querySelector('form').addEventListener('submit', function () {
                updateWeeklyDays();
            });

            // Initial check
            document.addEventListener('DOMContentLoaded', function () {
                toggleWeeklyDays();
                updateLabels();
            });
        </script>
    </div>
</body>

</html>
