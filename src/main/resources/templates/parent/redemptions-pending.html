<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-gift"></i> <span th:text="#{rewards.pending.title}">Approve Rewards</span></h2>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3" th:each="redemption : ${redemptions}">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0" th:text="${redemption.user.firstName}">Kind</h5>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${redemption.reward.title}">Belohnung</h5>
                        <p class="card-text" th:text="${redemption.reward.description}">Beschreibung</p>
                        <p>
                            <strong th:text="#{rewards.pending.cost}">Cost:</strong>
                            <span class="badge bg-danger" th:text="${redemption.pointsSpent} + ' ' + #{tasks.points}">0
                                Points</span>
                        </p>
                        <p>
                            <strong>Angefordert am:</strong>
                            <span
                                th:text="${#temporals.format(redemption.requestedAt, 'dd.MM.yyyy HH:mm')}">Datum</span>
                        </p>

                        <hr>

                        <form th:action="@{/parent/redemptions/{id}/approve(id=${redemption.id})}" method="post"
                            class="d-inline">
                            <input type="text" class="form-control mb-2" name="notes" placeholder="Notizen (optional)">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-check"></i> <span th:text="#{rewards.pending.approve}">Approve</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-12" th:if="${redemptions.isEmpty()}">
                <div class="alert alert-info" th:utext="#{rewards.pending.none}">
                    <i class="fas fa-info-circle"></i> No rewards awaiting approval.
                </div>
            </div>
        </div>
    </div>
</body>

</html>
