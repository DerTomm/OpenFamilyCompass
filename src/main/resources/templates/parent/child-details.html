<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body text-center">
                        <div th:if="${child.avatarPath}">
                            <img th:src="@{${child.avatarPath}}" class="rounded-circle mb-3"
                                style="width: 150px; height: 150px;" alt="Avatar">
                        </div>
                        <div th:unless="${child.avatarPath}" class="rounded-circle bg-secondary mx-auto mb-3"
                            style="width: 150px; height: 150px; line-height: 150px; font-size: 5rem; display: inline-block;">
                            👤
                        </div>
                        <h2 th:text="${child.firstName}">Kind</h2>
                        <p class="mb-0">
                            <span class="badge bg-success" style="font-size: 1.5rem;">
                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                            </span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-tasks"></i> Aufgaben</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Titel</th>
                                        <th>Status</th>
                                        <th>Punkte</th>
                                        <th>Fällig</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="task : ${tasks}">
                                        <td th:text="${task.title}">Aufgabe</td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${task.status.name() == 'PENDING'} ? 'bg-warning' : 
                                                                  (${task.status.name() == 'APPROVED'} ? 'bg-success' : 'bg-info')"
                                                th:text="${task.status}">Status</span>
                                        </td>
                                        <td th:text="${task.basePoints}">0</td>
                                        <td
                                            th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'dd.MM.yyyy') : '-'}">
                                            Datum</td>
                                    </tr>
                                    <tr th:if="${tasks.isEmpty()}">
                                        <td colspan="4" class="text-center text-muted">Keine Aufgaben vorhanden</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
