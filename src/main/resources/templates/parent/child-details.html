<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kind Details - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="/parent/dashboard">👨‍👩‍👧‍👦 Eltern Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/parent/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body text-center">
                        <div th:if="${child.avatarPath}">
                            <img th:src="@{${child.avatarPath}}" 
                                 class="rounded-circle mb-3" 
                                 style="width: 150px; height: 150px;"
                                 alt="Avatar">
                        </div>
                        <div th:unless="${child.avatarPath}" 
                             class="rounded-circle bg-secondary mx-auto mb-3" 
                             style="width: 150px; height: 150px; line-height: 150px; font-size: 5rem; display: inline-block;">
                            👤
                        </div>
                        <h2 th:text="${child.firstName}">Kind</h2>
                        <p class="mb-0">
                            <span class="badge bg-success" style="font-size: 1.5rem;">
                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                            </span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0"><i class="fas fa-heart"></i> Positive Gewohnheit erfassen</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/habits/{habitId}/record(habitId=1)}" method="post">
                            <input type="hidden" name="childId" th:value="${child.id}">
                            <p class="text-muted">Gewohnheiten-Feature wird bald verfügbar sein.</p>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Strafpunkte vergeben</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/penalties/create}" method="post">
                            <input type="hidden" name="childId" th:value="${child.id}">
                            <div class="mb-2">
                                <input type="text" class="form-control" name="reason" 
                                       placeholder="Grund" required>
                            </div>
                            <div class="mb-2">
                                <input type="number" class="form-control" name="points" 
                                       placeholder="Punkte" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="fas fa-minus-circle"></i> Strafpunkte abziehen
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-tasks"></i> Aufgaben</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Titel</th>
                                        <th>Status</th>
                                        <th>Punkte</th>
                                        <th>Fällig</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="task : ${tasks}">
                                        <td th:text="${task.title}">Aufgabe</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${task.status.name() == 'PENDING'} ? 'bg-warning' : 
                                                                  (${task.status.name() == 'APPROVED'} ? 'bg-success' : 'bg-info')"
                                                  th:text="${task.status}">Status</span>
                                        </td>
                                        <td th:text="${task.basePoints}">0</td>
                                        <td th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'dd.MM.yyyy') : '-'}">Datum</td>
                                    </tr>
                                    <tr th:if="${tasks.isEmpty()}">
                                        <td colspan="4" class="text-center text-muted">Keine Aufgaben vorhanden</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
