<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head th:replace="~{fragments/navbar :: head}">
</head>

<body>
    <nav th:replace="~{fragments/navbar :: parentNav}"></nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-gift"></i> <span th:text="#{reward.create.title}">Create New
                                Reward</span></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/rewards/create}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="title" class="form-label" th:text="#{reward.name}">Reward Name</label>
                                <input type="text" class="form-control" id="title" name="title"
                                    th:placeholder="#{reward.name.hint}" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label"
                                    th:text="#{reward.description}">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                    th:placeholder="#{reward.description.hint}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="pointsCost" class="form-label" th:text="#{reward.cost.label}">Cost in
                                    Points</label>
                                <input type="number" class="form-control" id="pointsCost" name="pointsCost" min="1"
                                    value="5" required>
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Bild (optional)</label>
                                <input type="file" class="form-control" id="image" name="image" accept="image/*">
                                <div class="form-text">Maximale Dateigröße: 5MB</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="fas fa-save"></i> <span th:text="#{reward.create.button}">Create
                                        Reward</span>
                                </button>
                                <a href="/parent/rewards" class="btn btn-outline-secondary"
                                    th:text="#{button.cancel}">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
