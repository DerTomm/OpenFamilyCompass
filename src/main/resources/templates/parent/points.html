<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-coins"></i> <span th:text="#{points.title}">Bonus and Penalty Points</span></h2>
                <p class="text-muted" th:text="#{points.subtitle}">Select a child to give bonus or penalty points.</p>
            </div>
        </div>

        <div class="row">
            <div th:each="child : ${children}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">
                        <!-- Avatar Display -->
                        <div class="mb-3">
                            <!-- Photo Avatar -->
                            <img th:if="${child.avatarType == 'PHOTO'}" th:src="@{/avatar/{userId}(userId=${child.id})}"
                                class="rounded-circle"
                                style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #007bff;"
                                alt="Avatar">

                            <!-- Icon Avatar -->
                            <img th:if="${child.avatarType == 'ICON' and child.avatarIconName != null}"
                                th:src="@{/images/avatars/{icon}.svg(icon=${child.avatarIconName})}"
                                class="rounded-circle"
                                style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #007bff; padding: 10px; background: white;"
                                alt="Avatar">

                            <!-- Default Avatar -->
                            <div th:if="${child.avatarType == 'DEFAULT' or (child.avatarType == 'ICON' and child.avatarIconName == null)}"
                                class="rounded-circle bg-secondary mx-auto d-inline-flex align-items-center justify-content-center"
                                style="width: 80px; height: 80px; border: 3px solid #007bff;">
                                <i class="fas fa-user fa-2x text-white"></i>
                            </div>
                        </div>
                        <h5 class="card-title" th:text="${child.firstName}">Kind</h5>
                        <p class="text-muted mb-3">
                            <small th:text="#{points.current.points(${child.totalPoints})}">Current points: 0</small>
                        </p>
                        <a th:href="@{/parent/points/manage/{childId}(childId=${child.id})}" class="btn btn-primary">
                            <i class="fas fa-coins"></i> <span th:text="#{points.child}">Manage Points</span>
                        </a>
                    </div>
                </div>
            </div>

            <div th:if="${children.isEmpty()}" class="col-12">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    <span th:text="#{message.no.data}">No children available.</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
