<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Chores & Rewards - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="h3 mb-3 fw-normal">🌟 Kids Chores & Rewards</h1>
                            <p class="text-muted">Melde dich mit deinem Namen und PIN an</p>
                        </div>

                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            ❌ Ungültiger Benutzername oder PIN!
                        </div>

                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            ✅ Du wurdest erfolgreich abgemeldet.
                        </div>

                        <form th:action="@{/perform_login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Benutzername</label>
                                <input type="text" class="form-control form-control-lg" 
                                       id="username" name="username" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">PIN</label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="password" name="password" 
                                       pattern="[0-9]*" inputmode="numeric" required>
                                <div class="form-text">Gib deine PIN ein</div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                🚀 Anmelden
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
