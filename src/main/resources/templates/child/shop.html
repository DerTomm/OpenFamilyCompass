<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"
    th:attr="data-bs-theme=${userTheme}">

<head>
    <title th:text="#{shop.title.page}">Reward Shop</title>
    <th:block layout:fragment="styles">
        <style>
            /* Light mode - default background */
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }

            .shop-card {
                background: white;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                color: inherit;
            }

            .reward-card {
                border: 3px solid transparent;
                transition: all 0.3s;
                height: 100%;
            }

            .reward-card:hover {
                border-color: #667eea;
                transform: translateY(-5px);
            }

            .reward-card.affordable {
                border-color: #28a745;
            }

            .reward-card.too-expensive {
                opacity: 0.6;
            }

            /* Dark mode support */
            [data-bs-theme="dark"] body {
                background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%);
            }

            [data-bs-theme="dark"] .shop-card {
                background: var(--bs-dark-bg-subtle);
                border: 1px solid var(--bs-border-color);
            }

            [data-bs-theme="dark"] .card {
                background-color: var(--bs-dark-bg-subtle);
                border-color: var(--bs-border-color);
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] h2,
            [data-bs-theme="dark"] h3 {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-title {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .text-muted {
                color: var(--bs-secondary-color) !important;
            }

            [data-bs-theme="dark"] .alert-success {
                background-color: var(--bs-success-bg-subtle);
                border-color: var(--bs-success-border-subtle);
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .alert-danger {
                background-color: var(--bs-danger-bg-subtle);
                border-color: var(--bs-danger-border-subtle);
                color: var(--bs-body-color);
            }

            /* Mobile optimizations */
            @media (max-width: 768px) {
                .shop-card {
                    border-radius: 10px;
                    padding: 1rem !important;
                }

                h2 {
                    font-size: 1.35rem !important;
                }

                .btn {
                    min-height: 44px;
                    font-size: 0.95rem;
                }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container my-4">
            <!-- Success/Error Messages -->
            <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show"
                th:text="#{shop.reward.pending}">
                ✅ Reward redeemed!
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${param.error == 'notenough'}" class="alert alert-danger alert-dismissible fade show"
                th:text="#{shop.reward.not.enough}">
                ❌ Not enough points!
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Available Rewards -->
            <div class="shop-card p-4 mb-4">
                <h2 class="mb-4"><i class="fas fa-gifts"></i> <span th:text="#{shop.available.rewards}">Available
                        Rewards</span></h2>

                <div class="row">
                    <div class="col-md-4 mb-4" th:each="reward : ${rewards}">
                        <div class="card reward-card"
                            th:classappend="${reward.pointsCost <= totalPoints} ? 'affordable' : 'too-expensive'">
                            <div class="card-body text-center">
                                <div th:if="${reward.imagePath}">
                                    <img th:src="@{${reward.imagePath}}" class="img-fluid mb-3"
                                        style="max-height: 150px;" alt="Belohnung">
                                </div>
                                <div th:unless="${reward.imagePath}" class="mb-3" style="font-size: 5rem;">
                                    🎁
                                </div>

                                <h4 class="card-title" th:text="${reward.title}">Belohnung</h4>
                                <p class="card-text" th:text="${reward.description}">Beschreibung</p>

                                <div class="mb-3">
                                    <span class="badge bg-primary" style="font-size: 1.3rem;">
                                        💎 <span th:text="${reward.pointsCost}">0</span> Punkte
                                    </span>
                                </div>

                                <form th:action="@{/child/shop/redeem/{id}(id=${reward.id})}" method="post">
                                    <button type="submit" class="btn btn-success btn-lg w-100"
                                        th:disabled="${reward.pointsCost > totalPoints}">
                                        <span th:if="${reward.pointsCost <= totalPoints}">🛒 Einlösen</span>
                                        <span th:unless="${reward.pointsCost <= totalPoints}">❌ Zu teuer</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${rewards.isEmpty()}" class="text-center text-muted py-5">
                    <i class="fas fa-inbox fa-4x mb-3"></i>
                    <h4 th:text="#{shop.no.rewards}">No rewards available</h4>
                    <p th:text="#{shop.no.rewards.desc}">Your parents will add great rewards soon!</p>
                </div>
            </div>

            <!-- My Redemptions -->
            <div class="shop-card p-4" th:if="${!myRedemptions.isEmpty()}">
                <h3 class="mb-4"><i class="fas fa-list"></i> <span th:text="#{shop.my.redemptions}">My Rewards</span>
                </h3>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th th:text="#{shop.reward.name}">Reward</th>
                                <th th:text="#{points.title}">Points</th>
                                <th th:text="#{shop.status}">Status</th>
                                <th th:text="#{shop.date}">Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="redemption : ${myRedemptions}">
                                <td th:text="${redemption.reward.title}">Reward</td>
                                <td th:text="${redemption.pointsSpent}">0</td>
                                <td>
                                    <span th:if="${redemption.status.name() == 'REQUESTED'}" class="badge bg-warning"
                                        th:text="#{shop.status.requested}">⏳ Awaiting Approval</span>
                                    <span th:if="${redemption.status.name() == 'APPROVED'}" class="badge bg-info"
                                        th:text="#{shop.status.approved}">✅ Approved</span>
                                    <span th:if="${redemption.status.name() == 'DELIVERED'}" class="badge bg-success"
                                        th:text="#{shop.status.delivered}">🎉 Received!</span>
                                    <span th:if="${redemption.status.name() == 'CANCELLED'}" class="badge bg-danger"
                                        th:text="#{shop.status.cancelled}">❌ Cancelled</span>
                                </td>
                                <td th:text="${#temporals.format(redemption.requestedAt, 'dd.MM.yyyy HH:mm')}">Datum
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
