<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"
    th:attr="data-bs-theme=${userTheme}">

<head>
    <title th:text="#{child.dashboard.title}">My Dashboard</title>
    <th:block layout:fragment="styles">
        <style>
            /* Light mode - default background */
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }

            .child-card {
                background: white;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                color: inherit;
            }

            .points-badge {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                padding: 20px;
                border-radius: 15px;
                color: white;
                font-size: 2rem;
                font-weight: bold;
            }

            .task-card {
                border-left: 5px solid #667eea;
                transition: transform 0.2s;
            }

            .task-card:hover {
                transform: translateX(5px);
            }

            /* Dark mode support */
            [data-bs-theme="dark"] body {
                background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%);
            }

            [data-bs-theme="dark"] .child-card {
                background: var(--bs-dark-bg-subtle);
                border: 1px solid var(--bs-border-color);
            }

            [data-bs-theme="dark"] .card {
                background-color: var(--bs-dark-bg-subtle);
                border-color: var(--bs-border-color);
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-body {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-title {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] h2,
            [data-bs-theme="dark"] h3,
            [data-bs-theme="dark"] h4 {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .text-muted {
                color: var(--bs-secondary-color) !important;
            }

            [data-bs-theme="dark"] .alert-info {
                background-color: var(--bs-info-bg-subtle);
                border-color: var(--bs-info-border-subtle);
                color: var(--bs-body-color);
            }

            /* Mobile optimizations */
            @media (max-width: 768px) {
                .child-card {
                    border-radius: 10px;
                    padding: 1rem !important;
                }

                .points-badge {
                    padding: 15px;
                    font-size: 1.5rem;
                }

                h2 {
                    font-size: 1.35rem !important;
                }

                h3 {
                    font-size: 1.15rem !important;
                }

                .btn {
                    min-height: 44px;
                    font-size: 0.95rem;
                }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container my-4">
            <!-- Points Display -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="child-card p-4 text-center">
                        <div th:if="${user.avatarType != 'DEFAULT'}" class="mb-3">
                            <img th:src="@{/avatar/current}" class="rounded-circle"
                                style="width: 120px; height: 120px; border: 5px solid #667eea;" alt="Dein Avatar">
                        </div>
                        <div th:unless="${user.avatarType != 'DEFAULT'}"
                            class="rounded-circle bg-secondary mx-auto mb-3"
                            style="width: 120px; height: 120px; line-height: 120px; font-size: 4rem; display: inline-block;">
                            👤
                        </div>
                        <h2 class="mb-3" th:text="#{child.dashboard.points.badge}">Your Points</h2>
                        <div class="points-badge">
                            ⭐ <span th:text="${totalPoints}">0</span> <span th:text="#{tasks.points}">Points</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row mb-4">
                <div class="col-md-4 mb-3">
                    <a href="/child/tasks" class="text-decoration-none">
                        <div class="child-card p-4 text-center">
                            <i class="fas fa-tasks fa-4x text-primary mb-3"></i>
                            <h4 th:text="#{tasks.my.title}">My Tasks</h4>
                            <p class="mb-0 badge bg-warning text-dark"
                                th:text="${pendingTasks.size()} + ' ' + #{tasks.available}">0 available</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-4 mb-3">
                    <a href="/child/shop" class="text-decoration-none">
                        <div class="child-card p-4 text-center">
                            <i class="fas fa-shopping-cart fa-4x text-success mb-3"></i>
                            <h4 th:text="#{child.dashboard.shop.title}">Reward Shop</h4>
                            <p class="mb-0 text-muted" th:text="#{child.dashboard.shop.subtitle}">Redeem points</p>
                        </div>
                    </a>
                </div>

                <div class="col-md-4 mb-3">
                    <a href="/child/history" class="text-decoration-none">
                        <div class="child-card p-4 text-center">
                            <i class="fas fa-history fa-4x text-info mb-3"></i>
                            <h4 th:text="#{history.title}">My History</h4>
                            <p class="mb-0 text-muted">Punkte-Verlauf</p>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Pending Tasks -->
            <div class="row" th:if="${pendingTasks.size() > 0}">
                <div class="col-12">
                    <div class="child-card p-4">
                        <h3 class="mb-4"><i class="fas fa-list-check"></i> <span
                                th:text="#{child.dashboard.tasks.available}">Available Tasks</span></h3>
                        <div class="task-card card mb-3" th:each="task : ${pendingTasks}">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <h5 class="card-title" th:text="${task.title}">Task</h5>
                                        <p class="card-text" th:text="${task.description}">Description</p>
                                        <small class="text-muted" th:if="${task.dueDate}">
                                            <span th:text="#{child.dashboard.due}">📅 Due:</span> <span
                                                th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy')}">Date</span>
                                        </small>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <div class="mb-2">
                                            <span class="badge bg-success" style="font-size: 1.2rem;"
                                                th:text="#{child.dashboard.tasks.points(${task.basePoints})}">
                                                ⭐ 0 Points
                                            </span>
                                        </div>
                                        <form th:action="@{/child/tasks/{id}/complete(id=${task.id})}" method="post">
                                            <button type="submit" class="btn btn-primary" th:text="#{tasks.complete}">
                                                Complete
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Completed Tasks Waiting for Approval -->
            <div class="row mt-4" th:if="${completedTasks.size() > 0}">
                <div class="col-12">
                    <div class="child-card p-4">
                        <h3 class="mb-4"><i class="fas fa-clock"></i> <span
                                th:text="#{child.dashboard.pending.review}">Waiting for Review</span></h3>
                        <div class="alert alert-info" th:each="task : ${completedTasks}">
                            <strong th:text="${task.title}">Task</strong> -
                            <span th:text="#{child.dashboard.completed.on}">Completed on</span> <span
                                th:text="${#temporals.format(task.completedAt, 'dd.MM.yyyy HH:mm')}">Date</span>
                            <br>
                            <small th:text="#{child.dashboard.parents.reviewing}">Your parents are still checking this!
                                🕐</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
