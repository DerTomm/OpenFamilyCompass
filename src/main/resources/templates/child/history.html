<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:attr="data-bs-theme=${userTheme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Historie - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .child-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .positive {
            color: #28a745;
            font-weight: bold;
        }
        .negative {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg" style="background: rgba(0,0,0,0.2);">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/child/dashboard">
                <span style="font-size: 1.5rem;">📊</span> Meine Historie
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">
                                    <i class="fas fa-user"></i> 
                                    <span sec:authentication="name">User</span>
                                </h6>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" href="/profile/settings">
                                    <i class="fas fa-cog"></i> Profileinstellungen
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt"></i> Abmelden
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="child-card p-4">
                    <h3 class="mb-4"><i class="fas fa-history"></i> Punkte-Verlauf</h3>
                    
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Datum</th>
                                    <th>Beschreibung</th>
                                    <th>Typ</th>
                                    <th class="text-end">Punkte</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="transaction : ${transactions}">
                                    <td th:text="${#temporals.format(transaction.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</td>
                                    <td th:text="${transaction.description}">Beschreibung</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${transaction.type == 'TASK'} ? 'bg-success' : 
                                                              (${transaction.type == 'REWARD'} ? 'bg-danger' : 
                                                              (${transaction.type == 'PENALTY'} ? 'bg-warning' : 'bg-info'))"
                                              th:text="${transaction.type}">Typ</span>
                                    </td>
                                    <td class="text-end" 
                                        th:classappend="${transaction.points > 0} ? 'positive' : 'negative'">
                                        <span th:if="${transaction.points > 0}">+</span>
                                        <span th:text="${transaction.points}">0</span>
                                    </td>
                                </tr>
                                <tr th:if="${transactions.isEmpty()}">
                                    <td colspan="4" class="text-center text-muted">
                                        Noch keine Aktivitäten vorhanden.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <h4>Aktueller Punktestand:</h4>
                        <div class="badge bg-success" style="font-size: 2rem;">
                            ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
