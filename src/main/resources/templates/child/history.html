<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Historie - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .child-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .positive {
            color: #28a745;
            font-weight: bold;
        }
        .negative {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark" style="background: rgba(0,0,0,0.2);">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/child/dashboard">
                <span style="font-size: 1.5rem;">📊</span> Meine Historie
            </a>
            <div class="navbar-nav ms-auto">
                <a href="/child/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="child-card p-4">
                    <h3 class="mb-4"><i class="fas fa-history"></i> Punkte-Verlauf</h3>
                    
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Datum</th>
                                    <th>Beschreibung</th>
                                    <th>Typ</th>
                                    <th class="text-end">Punkte</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="transaction : ${transactions}">
                                    <td th:text="${#temporals.format(transaction.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</td>
                                    <td th:text="${transaction.description}">Beschreibung</td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${transaction.type == 'TASK'} ? 'bg-success' : 
                                                              (${transaction.type == 'REWARD'} ? 'bg-danger' : 
                                                              (${transaction.type == 'PENALTY'} ? 'bg-warning' : 'bg-info'))"
                                              th:text="${transaction.type}">Typ</span>
                                    </td>
                                    <td class="text-end" 
                                        th:classappend="${transaction.points > 0} ? 'positive' : 'negative'">
                                        <span th:if="${transaction.points > 0}">+</span>
                                        <span th:text="${transaction.points}">0</span>
                                    </td>
                                </tr>
                                <tr th:if="${transactions.isEmpty()}">
                                    <td colspan="4" class="text-center text-muted">
                                        Noch keine Aktivitäten vorhanden.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mt-4 text-center">
                        <h4>Aktueller Punktestand:</h4>
                        <div class="badge bg-success" style="font-size: 2rem;">
                            ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
