<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <title>Meine Historie</title>
    <th:block layout:fragment="styles">
        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }

            .child-card {
                background: white;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }

            .positive {
                color: #28a745;
                font-weight: bold;
            }

            .negative {
                color: #dc3545;
                font-weight: bold;
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container my-4">
            <div class="row">
                <div class="col-12">
                    <div class="child-card p-4">
                        <h3 class="mb-4"><i class="fas fa-history"></i> <span th:text="#{history.points.history}">Points
                                History</span></h3>

                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th th:text="#{history.date}">Date</th>
                                        <th th:text="#{history.description}">Description</th>
                                        <th th:text="#{history.type}">Type</th>
                                        <th class="text-end" th:text="#{history.points}">Points</th>
                                        <th class="text-center" th:text="#{history.details}">Details</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="transaction : ${transactions}">
                                        <td th:text="${#temporals.format(transaction.createdAt, 'dd.MM.yyyy HH:mm')}">
                                            Datum
                                        </td>
                                        <td th:text="${transaction.description}">Beschreibung</td>
                                        <td>
                                            <span class="badge"
                                                th:classappend="${transaction.type == 'TASK'} ? 'bg-success' : 
                                                              (${transaction.type == 'REWARD'} ? 'bg-danger' : 
                                                              (${transaction.type == 'PENALTY'} ? 'bg-warning' : 
                                                              (${transaction.type == 'BEHAVIOR'} ? 'bg-primary' : 'bg-info')))"
                                                th:text="${transaction.type}">Typ</span>
                                        </td>
                                        <td class="text-end"
                                            th:classappend="${transaction.points > 0} ? 'positive' : 'negative'">
                                            <span th:if="${transaction.points > 0}">+</span>
                                            <span th:text="${transaction.points}">0</span>
                                        </td>
                                        <td class="text-center">
                                            <button
                                                th:if="${transaction.remarks != null and !#strings.isEmpty(transaction.remarks)}"
                                                class="btn btn-sm btn-outline-primary"
                                                th:onclick="'showRemarks(\'' + ${transaction.id} + '\', \'' + ${#strings.escapeJavaScript(transaction.description)} + '\', \'' + ${#strings.escapeJavaScript(transaction.remarks)} + '\')'">
                                                <i class="fas fa-comment-dots"></i> <span
                                                    th:text="#{history.remarks}">Remarks</span>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr th:if="${transactions.isEmpty()}">
                                        <td colspan="5" class="text-center text-muted"
                                            th:text="#{history.no.activities}">
                                            No activities yet.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-4 text-center">
                            <h4 th:text="#{history.current.balance}">Current Points:</h4>
                            <div class="badge bg-success" style="font-size: 2rem;">
                                ⭐ <span th:text="${child.totalPoints}">0</span> <span
                                    th:text="#{points.title}">Points</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bemerkungen Modal -->
        <div class="modal fade" id="remarksModal" tabindex="-1" aria-labelledby="remarksModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="remarksModalLabel">
                            <i class="fas fa-comment-dots"></i> Bemerkungen
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <h6 id="remarks-title" class="mb-3"></h6>
                        <div class="alert alert-light">
                            <p id="remarks-content" style="white-space: pre-wrap; margin-bottom: 0;"></p>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fas fa-times"></i> Schließen
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function showRemarks(transactionId, description, remarks) {
                document.getElementById('remarks-title').textContent = description;
                document.getElementById('remarks-content').textContent = remarks;

                const modal = new bootstrap.Modal(document.getElementById('remarksModal'));
                modal.show();
            }
        </script>
    </th:block>
</body>

</html>
