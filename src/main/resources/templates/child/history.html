<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Historie - OpenFamilyCompass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .child-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .positive {
            color: #28a745;
            font-weight: bold;
        }

        .negative {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg" style="background: rgba(0,0,0,0.2);">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/child/dashboard">
                <span style="font-size: 1.5rem;">📊</span> Meine Historie
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" id="profileDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle fa-lg"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li>
                                <h6 class="dropdown-header">
                                    <i class="fas fa-user"></i>
                                    <span sec:authentication="name">User</span>
                                </h6>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="/profile/settings">
                                    <i class="fas fa-cog"></i> Profileinstellungen
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline w-100">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="fas fa-sign-out-alt"></i> Abmelden
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-12">
                <div class="child-card p-4">
                    <h3 class="mb-4"><i class="fas fa-history"></i> Punkte-Verlauf</h3>

                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Datum</th>
                                    <th>Beschreibung</th>
                                    <th>Typ</th>
                                    <th class="text-end">Punkte</th>
                                    <th class="text-center">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="transaction : ${transactions}">
                                    <td th:text="${#temporals.format(transaction.createdAt, 'dd.MM.yyyy HH:mm')}">Datum
                                    </td>
                                    <td th:text="${transaction.description}">Beschreibung</td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${transaction.type == 'TASK'} ? 'bg-success' : 
                                                              (${transaction.type == 'REWARD'} ? 'bg-danger' : 
                                                              (${transaction.type == 'PENALTY'} ? 'bg-warning' : 
                                                              (${transaction.type == 'BEHAVIOR'} ? 'bg-primary' : 'bg-info')))"
                                            th:text="${transaction.type}">Typ</span>
                                    </td>
                                    <td class="text-end"
                                        th:classappend="${transaction.points > 0} ? 'positive' : 'negative'">
                                        <span th:if="${transaction.points > 0}">+</span>
                                        <span th:text="${transaction.points}">0</span>
                                    </td>
                                    <td class="text-center">
                                        <button
                                            th:if="${transaction.remarks != null and !#strings.isEmpty(transaction.remarks)}"
                                            class="btn btn-sm btn-outline-primary"
                                            th:onclick="'showRemarks(\'' + ${transaction.id} + '\', \'' + ${#strings.escapeJavaScript(transaction.description)} + '\', \'' + ${#strings.escapeJavaScript(transaction.remarks)} + '\')'">
                                            <i class="fas fa-comment-dots"></i> Bemerkungen
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${transactions.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">
                                        Noch keine Aktivitäten vorhanden.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-4 text-center">
                        <h4>Aktueller Punktestand:</h4>
                        <div class="badge bg-success" style="font-size: 2rem;">
                            ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bemerkungen Modal -->
    <div class="modal fade" id="remarksModal" tabindex="-1" aria-labelledby="remarksModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="remarksModalLabel">
                        <i class="fas fa-comment-dots"></i> Bemerkungen
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6 id="remarks-title" class="mb-3"></h6>
                    <div class="alert alert-light">
                        <p id="remarks-content" style="white-space: pre-wrap; margin-bottom: 0;"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Schließen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showRemarks(transactionId, description, remarks) {
            document.getElementById('remarks-title').textContent = description;
            document.getElementById('remarks-content').textContent = remarks;

            const modal = new bootstrap.Modal(document.getElementById('remarksModal'));
            modal.show();
        }
    </script>
</body>

</html>
