<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"
    th:attr="data-bs-theme=${userTheme}">

<head>
    <title th:text="#{tasks.my.title}">My Tasks</title>
    <th:block layout:fragment="styles">
        <style>
            /* Light mode - default background */
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }

            .child-card {
                background: white;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                color: inherit;
            }

            /* Dark mode support */
            [data-bs-theme="dark"] body {
                background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%);
            }

            [data-bs-theme="dark"] .child-card {
                background: var(--bs-dark-bg-subtle);
                border: 1px solid var(--bs-border-color);
            }

            [data-bs-theme="dark"] .card {
                background-color: var(--bs-dark-bg-subtle);
                border-color: var(--bs-border-color);
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-body {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .card-title {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] h3 {
                color: var(--bs-body-color);
            }

            [data-bs-theme="dark"] .text-muted {
                color: var(--bs-secondary-color) !important;
            }

            [data-bs-theme="dark"] .alert-info {
                background-color: var(--bs-info-bg-subtle);
                border-color: var(--bs-info-border-subtle);
                color: var(--bs-body-color);
            }

            /* Mobile optimizations */
            @media (max-width: 768px) {
                .child-card {
                    border-radius: 10px;
                    padding: 1rem !important;
                }

                h3 {
                    font-size: 1.15rem !important;
                }

                .btn {
                    min-height: 44px;
                    font-size: 0.95rem;
                }

                .card {
                    margin-bottom: 0.75rem !important;
                }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container my-4">
            <div class="row">
                <div class="col-12">
                    <div class="child-card p-4">
                        <h3 class="mb-4"><i class="fas fa-tasks"></i> <span th:text="#{tasks.my.title}">My Tasks</span>
                        </h3>

                        <div th:each="task : ${tasks}" class="card mb-3 border-start border-primary border-5">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <h5 class="card-title" th:text="${task.taskDefinition.title}">Task</h5>
                                        <p class="card-text" th:text="${task.taskDefinition.description}">Description
                                        </p>
                                        <small class="text-muted" th:if="${task.dueDate}">
                                            <span th:text="#{child.dashboard.due}">📅 Due:</span> <span
                                                th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy')}">Date</span>
                                        </small>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <div class="mb-2">
                                            <span class="badge bg-success" style="font-size: 1.2rem;"
                                                th:text="#{child.dashboard.tasks.points(${task.taskDefinition.basePoints})}">
                                                ⭐ 0 Points
                                            </span>
                                        </div>
                                        <form th:action="@{/child/tasks/{id}/complete(id=${task.id})}" method="post">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-primary" th:text="#{tasks.completed}">
                                                Completed!
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${tasks.isEmpty()}" class="alert alert-info" th:utext="#{tasks.all.completed}">
                            <i class="fas fa-star"></i> Great!
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
