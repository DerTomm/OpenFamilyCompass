<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgabe erstellen - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">🛡️ Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/admin/tasks" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-plus"></i> Neue Aufgabe erstellen</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/tasks/create}" method="post">
                            <div class="mb-3">
                                <label for="title" class="form-label">Titel</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Beschreibung</label>
                                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="basePoints" class="form-label">Belohnungspunkte</label>
                                <input type="number" class="form-control" id="basePoints" name="basePoints" 
                                       min="1" value="1" required>
                            </div>

                            <div class="mb-3">
                                <label for="childId" class="form-label">Zugewiesen an</label>
                                <select class="form-select" id="childId" name="childId">
                                    <option value="">Alle Kinder</option>
                                    <option th:each="child : ${children}" 
                                            th:value="${child.id}" 
                                            th:text="${child.firstName}">Kind</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="recurrenceType" class="form-label">Wiederholung</label>
                                <select class="form-select" id="recurrenceType" name="recurrenceType" required>
                                    <option th:each="type : ${recurrenceTypes}" 
                                            th:value="${type}" 
                                            th:text="${type}">Type</option>
                                </select>
                            </div>

                            <div class="mb-3" id="dueDateField">
                                <label for="dueDate" class="form-label">Fälligkeitsdatum</label>
                                <input type="date" class="form-control" id="dueDate" name="dueDate">
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="template" name="template" value="true">
                                <label class="form-check-label" for="template">
                                    Als Vorlage speichern (für wiederkehrende Aufgaben)
                                </label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-save"></i> Aufgabe erstellen
                                </button>
                                <a href="/admin/tasks" class="btn btn-outline-secondary">Abbrechen</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('recurrenceType').addEventListener('change', function() {
            const dueDateField = document.getElementById('dueDateField');
            const templateCheckbox = document.getElementById('template');
            
            if (this.value === 'ONCE') {
                dueDateField.style.display = 'block';
                templateCheckbox.checked = false;
            } else {
                dueDateField.style.display = 'block';
                templateCheckbox.checked = true;
            }
        });
    </script>
</body>
</html>
