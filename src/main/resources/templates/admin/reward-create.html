<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belohnung erstellen - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">🛡️ Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/admin/rewards" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fas fa-gift"></i> Neue Belohnung erstellen</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/rewards/create}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="title" class="form-label">Titel</label>
                                <input type="text" class="form-control" id="title" name="title" 
                                       placeholder="z.B. 1 Stunde Bildschirmzeit" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Beschreibung</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                          placeholder="Was beinhaltet diese Belohnung?"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="pointsCost" class="form-label">Kosten in Punkten</label>
                                <input type="number" class="form-control" id="pointsCost" name="pointsCost" 
                                       min="1" value="5" required>
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Bild (optional)</label>
                                <input type="file" class="form-control" id="image" name="image" 
                                       accept="image/*">
                                <div class="form-text">Maximale Dateigröße: 5MB</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="fas fa-save"></i> Belohnung erstellen
                                </button>
                                <a href="/admin/rewards" class="btn btn-outline-secondary">Abbrechen</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
