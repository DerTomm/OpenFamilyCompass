<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}" th:attr="data-bs-theme=${userTheme}">

<body>
    <div layout:fragment="content" class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-user-plus"></i> <span th:text="#{user.create.title}">Neuer
                                Benutzer</span></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/create}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{user.username}">Benutzername
                                    (Vorname)</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="firstName" class="form-label"
                                    th:text="#{user.firstname}">Anzeigename</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>
                                <div class="form-text" th:text="#{user.firstname.hint}">Wird standardmäßig mit dem
                                    Benutzernamen vorbelegt</div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{user.password}">Passwort</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="form-text" th:text="#{user.password.hint}">Mindestens 6 Zeichen</div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label" th:text="#{user.role}">Rolle</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="" selected disabled th:text="#{user.role.select}">Rolle auswählen...
                                    </option>
                                    <option th:each="role : ${roles}" th:value="${role}"
                                        th:text="#{${role.getDisplayKey()}}">Role</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save"></i> <span th:text="#{user.create.button}">Benutzer
                                        erstellen</span>
                                </button>
                                <a href="/admin/users" class="btn btn-outline-secondary"
                                    th:text="#{button.cancel}">Abbrechen</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            document.getElementById('username').addEventListener('input', function () {
                const firstNameInput = document.getElementById('firstName');
                firstNameInput.value = this.value.charAt(0).toUpperCase() + this.value.slice(1);
            });

            document.getElementById('role').addEventListener('change', function () {
                const childFields = document.getElementById('childFields');

                if (this.value === 'CHILD') {
                    childFields.style.display = 'block';
                } else {
                    childFields.style.display = 'none';
                }
            });
        </script>
    </div>
</body>

</html>
