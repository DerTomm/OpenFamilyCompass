<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:attr="data-bs-theme=${userTheme}">

<head th:replace="~{fragments/navbar :: head}">
</head>

<body>
    <nav th:replace="~{fragments/navbar :: adminNav}"></nav>

    <div class="container my-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-user-plus"></i> <span th:text="#{user.create.title}">Neuer
                                Benutzer</span></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/create}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label" th:text="#{user.username}">Benutzername
                                    (Vorname)</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label" th:text="#{user.password}">Passwort</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="form-text" th:text="#{user.password.hint}">Mindestens 6 Zeichen</div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label" th:text="#{user.role}">Rolle</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="" selected disabled th:text="#{user.role.select}">Rolle auswählen...
                                    </option>
                                    <option th:each="role : ${roles}" th:value="${role}" th:text="${role}">Role</option>
                                </select>
                            </div>

                            <div id="childFields" style="display: none;">
                                <div class="mb-3">
                                    <label for="firstName" class="form-label" th:text="#{user.child.firstname}">Vorname
                                        des Kindes</label>
                                    <input type="text" class="form-control" id="firstName" name="firstName">
                                </div>

                                <div class="mb-3">
                                    <label for="avatarPath" class="form-label" th:text="#{user.child.avatar}">Avatar
                                        (optional)</label>
                                    <select class="form-select" id="avatarPath" name="avatarPath">
                                        <option value="" th:text="#{user.avatar.none}">Kein Avatar</option>
                                        <option value="/images/avatars/cat.png" th:text="#{user.avatar.cat}">🐱 Katze
                                        </option>
                                        <option value="/images/avatars/dog.png" th:text="#{user.avatar.dog}">🐶 Hund
                                        </option>
                                        <option value="/images/avatars/bear.png" th:text="#{user.avatar.bear}">🐻 Bär
                                        </option>
                                        <option value="/images/avatars/lion.png" th:text="#{user.avatar.lion}">🦁 Löwe
                                        </option>
                                        <option value="/images/avatars/elephant.png" th:text="#{user.avatar.elephant}">
                                            🐘 Elefant</option>
                                        <option value="/images/avatars/giraffe.png" th:text="#{user.avatar.giraffe}">🦒
                                            Giraffe</option>
                                        <option value="/images/avatars/panda.png" th:text="#{user.avatar.panda}">🐼
                                            Panda</option>
                                        <option value="/images/avatars/unicorn.png" th:text="#{user.avatar.unicorn}">🦄
                                            Einhorn</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-save"></i> <span th:text="#{user.create.button}">Benutzer
                                        erstellen</span>
                                </button>
                                <a href="/admin/users" class="btn btn-outline-secondary"
                                    th:text="#{button.cancel}">Abbrechen</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('role').addEventListener('change', function () {
            const childFields = document.getElementById('childFields');
            const firstNameInput = document.getElementById('firstName');

            if (this.value === 'CHILD') {
                childFields.style.display = 'block';
                firstNameInput.required = true;
            } else {
                childFields.style.display = 'none';
                firstNameInput.required = false;
            }
        });
    </script>
</body>

</html>
