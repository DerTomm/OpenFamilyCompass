<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gewohnheiten verwalten - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">🛡️ Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/admin/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-heart"></i> Positive Gewohnheiten</h2>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0">Alle Gewohnheiten</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Titel</th>
                                        <th>Beschreibung</th>
                                        <th>Punkte</th>
                                        <th>Kind</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="habit : ${habits}">
                                        <td th:text="${habit.title}">Titel</td>
                                        <td th:text="${habit.description}">Beschreibung</td>
                                        <td><span class="badge bg-warning" th:text="${habit.points}">0</span></td>
                                        <td th:text="${habit.child != null ? habit.child.firstName : 'Alle'}">Kind</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${habit.active} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${habit.active} ? 'Aktiv' : 'Inaktiv'">Status</span>
                                        </td>
                                    </tr>
                                    <tr th:if="${habits.isEmpty()}">
                                        <td colspan="5" class="text-center text-muted">
                                            Keine Gewohnheiten definiert.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
