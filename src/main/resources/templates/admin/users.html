<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/navbar :: head}">
</head>
<body>
    <nav th:replace="~{fragments/navbar :: adminNav}"></nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fas fa-users"></i> Benutzerverwaltung</h2>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12">
                <a href="/admin/users/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Neuer Benutzer
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Alle Benutzer</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Benutzername</th>
                                        <th>Rolle</th>
                                        <th>Status</th>
                                        <th>Erstellt am</th>
                                        <th>Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.username}">Username</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'PARENT'} ? 'bg-success' : 'bg-info')"
                                                  th:text="${user.role.name()}">Role</span>
                                        </td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${user.active} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${user.active} ? 'Aktiv' : 'Inaktiv'">Status</span>
                                        </td>
                                        <td th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</td>
                                        <td>
                                            <button class="btn btn-sm btn-outline-primary" disabled>
                                                <i class="fas fa-edit"></i> Bearbeiten
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
