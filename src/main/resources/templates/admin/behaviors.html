<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verhalten verwalten - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">🛡️ Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/admin/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h2><i class="fas fa-star"></i> Verhalten verwalten</h2>
                <a href="/admin/behaviors/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Neues Verhalten
                </a>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0">Alle Verhaltensregeln</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Titel</th>
                                        <th>Leitsatz</th>
                                        <th>Punkte</th>
                                        <th>Kind</th>
                                        <th>Status</th>
                                        <th>Aktionen</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="behavior : ${behaviors}">
                                        <td><strong th:text="${behavior.title}">Titel</strong></td>
                                        <td th:text="${behavior.guideline}">Leitsatz</td>
                                        <td><span class="badge bg-success" th:text="${behavior.points} + ' Punkte'">0</span></td>
                                        <td th:text="${behavior.child != null ? behavior.child.firstName : 'Alle'}">Kind</td>
                                        <td>
                                            <span class="badge" 
                                                  th:classappend="${behavior.active} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${behavior.active} ? 'Aktiv' : 'Inaktiv'">Status</span>
                                        </td>
                                        <td>
                                            <form th:if="${behavior.active}" th:action="@{/admin/behaviors/{id}/deactivate(id=${behavior.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Verhalten deaktivieren?')">
                                                    <i class="fas fa-ban"></i> Deaktivieren
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${behaviors.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted">
                                            Keine Verhaltensregeln definiert. Klicke auf "Neues Verhalten" um eine zu erstellen.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
