<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kind Details - Kids Chores & Rewards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">🛡️ Admin Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a href="/admin/dashboard" class="btn btn-outline-light me-2">Zurück</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light">Abmelden</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body text-center">
                        <div th:if="${child.avatarPath}">
                            <img th:src="@{${child.avatarPath}}" 
                                 class="rounded-circle mb-3" 
                                 style="width: 150px; height: 150px;"
                                 alt="Avatar">
                        </div>
                        <div th:unless="${child.avatarPath}" 
                             class="rounded-circle bg-secondary mx-auto mb-3" 
                             style="width: 150px; height: 150px; line-height: 150px; font-size: 5rem; display: inline-block;">
                            👤
                        </div>
                        <h2 th:text="${child.firstName}">Kind</h2>
                        <p class="mb-0">
                            <span class="badge bg-success" style="font-size: 1.5rem;">
                                ⭐ <span th:text="${child.totalPoints}">0</span> Punkte
                            </span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Details</h5>
                    </div>
                    <div class="card-body">
                        <p>Weitere Details und Aktionen können hier hinzugefügt werden.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
