spring:
  application:
    name: OpenFamilyCompass

  # Build info (automatically populated by maven)
  info:
    app:
      name: OpenFamilyCompass
      description: Open source family management application

  datasource:
    # ⚠️ SECURITY WARNING: Change these credentials in production!
    # Use environment variables or external configuration for production deployments
    # Example: SPRING_DATASOURCE_PASSWORD=your_secure_password
    url: jdbc:postgresql://localhost:5432/openfamilycompass_db
    username: openfamilycompass_user
    password: openfamilycompass_password # ⚠️ CHANGE IN PRODUCTION!
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    user:
      # ⚠️ SECURITY WARNING: These are default credentials for development only!
      # The application creates a proper admin user (see app.admin below)
      name: admin
      password: admin # ⚠️ FOR DEVELOPMENT ONLY!
    oauth2:
      client:
        # ⚠️ SECURITY WARNING: Change this secret in production!
        # Use environment variable: SPRING_SECURITY_OAUTH2_CLIENT_SECRET=your_secure_secret
        secret: change-me-in-production # ⚠️ CHANGE IN PRODUCTION!

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    org.openfamilycompass: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  avatars:
    upload-dir: uploads/avatars
    predefined:
      - cat.png
      - dog.png
      - bear.png
      - lion.png
      - elephant.png
      - giraffe.png
      - panda.png
      - unicorn.png
  admin:
    # ⚠️ SECURITY WARNING: These are default credentials for first-time setup only!
    # IMMEDIATELY change the admin password after first login in production!
    # Or set via environment: APP_ADMIN_DEFAULT_PASSWORD=your_secure_password
    default-username: admin
    default-password: "admin" # ⚠️ CHANGE AFTER FIRST LOGIN!

# Firebase Cloud Messaging Configuration
# Project ID is read from firebase-service-account.json at runtime
